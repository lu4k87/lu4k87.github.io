    const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(4, Math.round(len / 1.4));
    const ux = (x2 - x1) / len, uy = (y2 - y1) / len, amp = 0.55;
    let d = `M${x1} ${y1}`;
    for (let i = 1; i < n; i++) {
      const t = (i / n) * len, side = i % 2 ? amp : -amp;
      d += `L${x1 + ux * t - uy * side} ${y1 + uy * t + ux * side}`;
    }
    return `${d}L${x2} ${y2}`;
  }

  function drawRelation(r) {
    const a = byId.get(r.a_id), b = byId.get(r.b_id);
    if (!a || !b) return s('g');
    const k = KINDS[r.kind] || KINDS.neutral;
    let [x1, y1] = P(a.bx, a.by), [x2, y2] = P(b.bx, b.by);
    // Linien an den Figuren kürzen, damit Pfeile sichtbar bleiben
    const len = Math.hypot(x2 - x1, y2 - y1) || 1, cut = Math.min(2.4, len / 3);
    const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    x1 += ux * cut; y1 += uy * cut; x2 -= ux * cut; y2 -= uy * cut;
    const d = relPath(x1, y1, x2, y2, k);
    const isSel = sel?.type === 'relation' && sel.id === r.id;
    const g = s(`g.sk-rel${isSel ? '.selected' : ''}`, { tabindex: 0, role: 'button',
      'aria-label': `Beziehung ${figLabel(a)} – ${figLabel(b)}: ${k.label}` },
    s('path.hit', { d: `M${x1} ${y1}L${x2} ${y2}` }),
    s('path.vis', { d, fill: 'none', stroke: k.color, 'stroke-width': k.width,
      'stroke-dasharray': k.dash, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      'marker-start': k.arrows ? `url(#arr-${r.kind})` : null, 'marker-end': k.arrows ? `url(#arr-${r.kind})` : null }));
    if (k.cut) {
      // Abgebrochen: Lücke in der Mitte mit zwei Querstrichen
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, nx = -uy * 1, ny = ux * 1;
      g.append(s('path', { d: `M${mx - ux * 0.6 + nx} ${my - uy * 0.6 + ny}l${-2 * nx} ${-2 * ny}M${mx + ux * 0.6 + nx} ${my + uy * 0.6 + ny}l${-2 * nx} ${-2 * ny}`,
        stroke: k.color, 'stroke-width': 0.4 }));
      g.querySelector('.vis').setAttribute('stroke-dasharray', `${len / 2 - cut - 0.6} 1.2`);
    }
    const open = (e) => { e.stopPropagation(); select({ type: 'relation', id: r.id }); };
    g.addEventListener('click', open);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
    return g;
  }

  function drawFigure(f) {
    const isSel = (sel?.type === 'figure' && sel.id === f.id) || persp === f.id;
    const pick = (linking && linking === f.id) || (openQ && answerTo === f);
    const g = s(`g.sk-fig${isSel ? '.selected' : ''}${pick ? '.pick' : ''}${outOfView(f) ? '.sk-dim' : ''}`,
      { tabindex: 0, role: 'button', 'aria-label': figLabel(f) });
    const small = f.size === 'klein';
    if (iso()) {
      const hgt = small ? 6.5 : 9.5, w = small ? 1.4 : 1.9;
      const [x, y] = P(f.bx, f.by);
      const head = small ? 1.25 : 1.55;
      const a = rad(f.angle);
      // Blickrichtung am Boden + Nase am Kopf, beides projiziert
      const [gx, gy] = P(f.bx + Math.cos(a) * 3.6, f.by + Math.sin(a) * 3.6);
      const [nx, ny] = P(f.bx + Math.cos(a) * 1, f.by + Math.sin(a) * 1);
      const dx = nx - x, dy = ny - y;
      g.append(
        s('ellipse', { cx: x, cy: y, rx: w * 1.25, ry: w * 0.62, fill: 'rgb(0 0 0 / 22%)' }),
        s('line', { x1: x, y1: y, x2: gx, y2: gy, stroke: f.color, 'stroke-width': 0.5, 'stroke-linecap': 'round', opacity: 0.85 }),
        s('ellipse.ring', { cx: x, cy: y, rx: w * 1.9, ry: w * 1.05 }),
        ...(f.shape && f.shape !== 'figur' ? isoBody(f.shape, x, y, w, hgt, f.color) : [
          s('path', { d: `M${x - w} ${y}L${x - w * 0.8} ${y - hgt + head * 1.6}Q${x} ${y - hgt + head * 0.9} ${x + w * 0.8} ${y - hgt + head * 1.6}L${x + w} ${y}Q${x} ${y + w * 0.5} ${x - w} ${y}z`,
            fill: f.color, stroke: 'rgb(0 0 0 / 35%)', 'stroke-width': 0.15 }),
          s('path', { d: `M${x} ${y - hgt + head * 1.3}L${x + w * 0.8} ${y - hgt + head * 1.6}L${x + w} ${y}Q${x + w * 0.5} ${y + w * 0.4} ${x} ${y + w * 0.5}z`,
            fill: 'rgb(0 0 0 / 14%)' }),
          s('circle', { cx: x, cy: y - hgt + head * 0.55, r: head, fill: '#f0d2b0', stroke: 'rgb(0 0 0 / 35%)', 'stroke-width': 0.15 }),
          s('circle', { cx: x + dx * 1.1, cy: y - hgt + head * 0.55 + dy * 1.1, r: head * 0.32, fill: '#c99c74' })]));
    } else {
      const r = small ? 1.6 : 2.2;
      const a = rad(f.angle);
      const nose = [[Math.cos(a) * (r + 1.3), Math.sin(a) * (r + 1.3)],
        [Math.cos(a + 0.6) * r * 0.9, Math.sin(a + 0.6) * r * 0.9],
        [Math.cos(a - 0.6) * r * 0.9, Math.sin(a - 0.6) * r * 0.9]];
      g.setAttribute('transform', `translate(${f.bx} ${f.by})`);
      g.append(
        s('circle.ring', { r: r + 1.2 }),
        s('polygon', { points: nose.map((p) => p.join(',')).join(' '), fill: f.color, stroke: 'var(--surface)', 'stroke-width': 0.25 }),
        f.shape === 'quader'
          ? s('rect', { x: -r, y: -r, width: 2 * r, height: 2 * r, transform: `rotate(${f.angle})`, fill: f.color, stroke: 'var(--surface)', 'stroke-width': 0.35 })
          : s('circle', { r, fill: f.color, stroke: 'var(--surface)', 'stroke-width': 0.35 }),
        small || (f.shape && f.shape !== 'figur') ? null : s('circle', { r: r * 0.45, fill: 'none', stroke: 'var(--surface)', 'stroke-width': 0.25 }));
    }
    const open = (e) => { e.stopPropagation(); onFigure(f); };
    g.addEventListener('click', open);
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
    return g;
  }

  // Namen ohne Überlappung: je Figur die erste freie Position aus einer
  // kleinen Kandidatenliste (darüber, versetzt, darunter) wählen.
  function placeLabels(order) {
    const placed = [];
    const LH = 2.1;
    return order.map((f) => {
      const small = f.size === 'klein';
      const [x, y] = iso() ? P(f.bx, f.by, small ? 8.4 : 11.6) : [f.bx, f.by + (small ? 4 : 4.7)];
      const text = figLabel(f);
      const w = text.length * 0.92 + 0.6;
      const tries = [[0, 0], [0, -LH], [0, LH], [w / 2 + 0.8, 0], [-w / 2 - 0.8, 0], [0, -2 * LH], [0, 2 * LH]];
      const free = ([dx, dy]) => !placed.some((b) => Math.abs(b.x - (x + dx)) < (b.w + w) / 2
        && Math.abs(b.y - (y + dy)) < LH * 0.95);
      const [dx, dy] = tries.find(free) || tries[0];
      placed.push({ x: x + dx, y: y + dy, w });
      return s('text.sk-label', { x: x + dx, y: y + dy, 'text-anchor': 'middle', 'pointer-events': 'none' }, text);
    });
  }

  svg.addEventListener('click', () => { if (!linking) select(null); });

  // ── Auswahl, Beziehung verbinden ────────────────────────────────────
  async function onFigure(f) {
    if (guide && openQ && !readOnly) { answerTo = answerTo === f ? null : f; render(); renderSide(); return; }
    if (persp) { setPersp(f.id); return; }
    if (!linking) { select({ type: 'figure', id: f.id }); return; }
    if (linking === true) { linking = f.id; hint.textContent = `${figLabel(f)} gewählt – jetzt die zweite Figur antippen.`; render(); return; }
    if (linking === f.id) return;
    const a = linking;
    if (rels.some((r) => (r.a_id === a && r.b_id === f.id) || (r.a_id === f.id && r.b_id === a))) {
      hint.textContent = 'Diese Beziehung gibt es schon – sie ist jetzt ausgewählt.';
    }
    let r = rels.find((x) => (x.a_id === a && x.b_id === f.id) || (x.a_id === f.id && x.b_id === a));
    if (!r) {
      const res = await guard(api.post(`/api/scenes/${sc.id}/relations`, { a_id: a, b_id: f.id, kind: 'neutral' }));
      if (!res) return;
      r = { id: res.id, a_id: a, b_id: f.id, kind: 'neutral', dynamic: '', conflict: '', communication: '', notes: '' };
      rels.push(r);
    }
    setLinking(false);
    if (!prefs.rel) { prefs.rel = true; relBox.checked = true; savePrefs(prefs); }
    select({ type: 'relation', id: r.id });
  }

  function setLinking(on) {
    linking = on ? true : null;
    linkBtn.setAttribute('aria-pressed', String(!!on));
    hint.hidden = !on;
    hint.textContent = 'Erste Figur antippen, dann die zweite.';
    render();
  }

  function select(next) {
    sel = next;
    render();
    renderSide();
  }

  // ── Seitenleiste ────────────────────────────────────────────────────
  const side = h('div.stack');

  function setPersp(id) {
    persp = id || null;
    if (persp) { guide = false; sel = null; }
    perspSel.value = persp || '';
    dimLabel.hidden = !persp;
    guideBtn.setAttribute('aria-pressed', String(guide));
    render();
    renderSide();
  }

  function setGuide(on) {
    guide = on;
    if (on) { persp = null; perspSel.value = ''; dimLabel.hidden = true; }
    openQ = null; answerTo = null;
    guideBtn.setAttribute('aria-pressed', String(on));
    render();
    renderSide();
  }

  function renderSide() {
    if (!linking) {
      hint.hidden = !(guide && openQ && !readOnly);
      hint.textContent = 'Figur antippen = Antwort dort ablegen; nochmal antippen = an die ganze Aufstellung.';
    }
    if (persp) { side.replaceChildren(perspCard(byId.get(persp))); return; }
    if (guide) { side.replaceChildren(guideCard()); return; }
    if (sel?.type === 'figure') side.replaceChildren(figureCard(byId.get(sel.id)));
    else if (sel?.type === 'relation') side.replaceChildren(relationCard(rels.find((r) => r.id === sel.id)));
    else side.replaceChildren(summaryCard());
    side.append(legendCard());
  }

  const names = (ids) => ids.map((id) => figLabel(byId.get(id))).join(', ') || '–';
  const personOf = (f) => sc.persons.find((pe) => pe.id === f.person_id);
  const readOnly = isClosed(sc.case_status);

  const ofFigure = (f, kind) => comments.filter((c) => c.target_type === 'figure' && c.target_id === f.id && c.kind === kind);
  const list = (rows) => (rows.length ? rows.map((r) => `${figLabel(r.o)} (${r.d.toFixed(0)} cm)`).join(', ') : '–');

  function perspCard(f) {
    const v = viewOf(f);
    const swap = h('select', { 'aria-label': 'Rollentausch', onchange: (e) => e.target.value && setPersp(+e.target.value) },
      h('option', { value: '' }, 'Rollentausch: Sicht von …'),
      figs.filter((o) => o !== f).map((o) => h('option', { value: o.id }, figLabel(o))));
    return h('section.card', {},
      h('div.detail-head', {}, h('span.swatch', { style: `background:${f.color}` }),
        h('div.grow', {}, h('h2', {}, `Aus Sicht von ${figLabel(f)}`),
          personOf(f)?.ref ? h('p.meta.mono', {}, personOf(f).ref) : null),
        closeBtn(() => setPersp(null))),
      h('p.meta', {}, 'Was diese Figur von ihrem Platz aus sieht. Ich-Sätze halten fest, wie es sich dort anfühlt.'),
      h('dl.kv', {}, h('dt', {}, 'sieht'), h('dd', {}, list(v.sees)), h('dt', {}, 'am Rand'), h('dd', {}, list(v.side)),
        h('dt', {}, 'im Rücken'), h('dd', {}, list(v.back)),
        h('dt', {}, 'nächste Figur'), h('dd', {}, v.sees.concat(v.side, v.back).sort((x, y) => x.d - y.d)[0]
          ? list([v.sees.concat(v.side, v.back).sort((x, y) => x.d - y.d)[0]]) : '–')),
      h('h3', {}, 'Ich-Sätze an diesem Platz'),
      commentList(sc.session_id, ofFigure(f, 'ich'), { target_type: 'figure', target_id: f.id, kind: 'ich' }, {
        readOnly, placeholder: '„Ich …“ – Satz der Figur an diesem Platz', addLabel: 'Ich-Satz speichern',
        empty: 'Noch kein Ich-Satz', onChange: (items) => syncComments('figure', f.id, items, 'ich') }),
      h('div.row.no-print', {}, swap));
  }

  function guideCard() {
    const qs = sc.template?.questions || [];
    const kinds = Object.keys(QUESTION_KINDS).filter((k) => qs.some((q) => q.kind === k));
    if (!kinds.includes(qKind)) qKind = kinds[0];
    const answers = (q) => comments.filter((c) => c.kind === 'antwort' && c.question === q.text
      && ((c.target_type === 'scene' && c.target_id === sc.id) || (c.target_type === 'figure' && byId.has(c.target_id))));
    const where = (c) => (c.target_type === 'figure' ? figLabel(byId.get(c.target_id)) : 'Aufstellung');
    async function save(q) {
      const text = draft.trim();
      if (!text) return;
      const target = answerTo ? { target_type: 'figure', target_id: answerTo.id } : { target_type: 'scene', target_id: sc.id };
      const res = await guard(api.post(`/api/sessions/${sc.session_id}/comments`,
        { ...target, kind: 'antwort', question: q.text, text }));
      if (!res) return;
      comments.push({ id: res.id, ...target, kind: 'antwort', question: q.text, text, created_at: new Date().toISOString() });
      draft = '';
      renderSide();
    }
    async function remove(c) {
      if (!confirm('Antwort löschen?') || !await guard(api.del(`/api/comments/${c.id}`))) return;
      comments.splice(comments.indexOf(c), 1);
      renderSide();
    }
    const item = (q) => {
      const open = openQ === q;
      const got = answers(q);
      return h(`li${open ? '.open' : ''}`, {},
        h('button.qbtn', { type: 'button', 'aria-expanded': String(open),
          onclick: () => { openQ = open ? null : q; answerTo = null; draft = ''; render(); renderSide(); } },
        q.title ? h('span.qt', {}, q.title) : null, h('span', {}, q.text),
        got.length ? h('span.badge.info', {}, `${got.length} ${got.length === 1 ? 'Antwort' : 'Antworten'}`) : null),
        open ? got.map((c) => h('div.answer', {},
          c === editing ? editForm(c, () => { editing = null; renderSide(); }) : h('p', {}, c.text),
          h('div.row', {}, h('span.badge.info', {}, `↳ ${where(c)}`),
            h('span.meta', {}, fmtDateTime(c.created_at), c.updated_at ? ` · geändert ${fmtDateTime(c.updated_at)}` : ''),
            readOnly || c === editing ? null : [
              editBtn('Antwort ändern', () => { editing = c; renderSide(); }),
              h('button.icon-btn', { type: 'button', 'aria-label': 'Antwort löschen', onclick: () => remove(c) },
                icon('trash'))]))) : null,
        open && !readOnly ? [
          h('textarea', { rows: 2, value: draft, placeholder: 'Antwort notieren …', 'aria-label': 'Antwort',
            oninput: (e) => { draft = e.target.value; } }),
          h('div.row', {}, h('span.badge', {}, `↳ ${answerTo ? figLabel(answerTo) : 'ganze Aufstellung'}`),
            btn('Antwort speichern', () => save(q), { small: true, kind: 'primary', iconName: 'plus' }))] : null);
    };
    return h('section.card', {},
      h('div.detail-head', {}, h('h2.grow', {}, 'Leitfaden'), closeBtn(() => setGuide(false))),
      h('p.meta', {}, `${sc.template?.name || 'Familienbrett'} · Antworten hängen an Figur und Sitzung`),
      kinds.length > 1 ? h('div.seg.wrap', { role: 'group', 'aria-label': 'Art der Fragen' }, kinds.map((k) => h('button', {
        type: 'button', 'aria-pressed': String(k === qKind),
        onclick: () => { qKind = k; openQ = null; answerTo = null; render(); renderSide(); } }, QUESTION_KINDS[k]))) : null,
      qs.length ? h('ol.qlist', {}, qs.filter((q) => q.kind === qKind).map(item))
        : h('p', {}, 'Diese Vorlage hat keine Leitfragen. Fragen ergänzen: Verwaltung › Vorlagen.'));
  }

  function figureCard(f) {
    const m = metrics.figures[f.id] || {};
    const seenBy = figs.filter((o) => (metrics.figures[o.id]?.looks_at || []).includes(f.id)).map((o) => o.id);
    const mine = rels.filter((r) => r.a_id === f.id || r.b_id === f.id);
    const zone = zoneOf(layout, W, H, f);
    const ich = ofFigure(f, 'ich');
    const answers = ofFigure(f, 'antwort');
    return h('section.card', {},
      h('div.detail-head', {}, h('span.swatch', { style: `background:${f.color}` }),
        h('h2.grow', {}, figLabel(f)), closeBtn()),
      h('dl.kv', {},
        h('dt', {}, 'Person'), h('dd', {}, personOf(f)?.ref ? h('span.mono', {}, personOf(f).ref) : 'keine zugeordnet'),
        h('dt', {}, 'Rolle'), h('dd', {}, f.role),
        f.name ? [h('dt', {}, 'Name'), h('dd', {}, f.name)] : null,
        f.age ? [h('dt', {}, 'Alter'), h('dd', {}, f.age)] : null,
        h('dt', {}, 'Blickt zu'), h('dd', {}, names(m.looks_at || [])),
        h('dt', {}, 'Angeschaut von'), h('dd', {}, names(seenBy)),
        h('dt', {}, 'Nächste Figur'), h('dd', {}, m.nearest ? `${figLabel(byId.get(m.nearest))} (${m.nearest_cm.toFixed(0)} cm)` : '–'),
        h('dt', {}, 'Lage'), h('dd', {}, m.center_dist_pct < 35 ? 'nahe der Mitte' : m.center_dist_pct > 75 ? 'am Rand' : 'zwischen Mitte und Rand'),
        zone ? [h('dt', {}, 'Feld'), h('dd', {}, zone)] : null),
      f.notes ? h('p', {}, f.notes) : null,
      ich.length ? [h('h3', {}, 'Ich-Sätze'), ich.map((c) => h('div.quote', {}, `„${c.text}“`, h('small', {}, fmtDateTime(c.created_at))))] : null,
      answers.length ? [h('h3', {}, 'Antworten aus dem Leitfaden'), answers.map((c) => h('div.answer', {},
        h('p.meta', {}, c.question), h('p', {}, c.text)))] : null,
      mine.length ? h('div.stack', { style: 'gap:6px' }, h('h3', {}, 'Beziehungen'),
        mine.map((r) => {
          const o = byId.get(r.a_id === f.id ? r.b_id : r.a_id);
          return btn(`${(KINDS[r.kind] || KINDS.neutral).label} zu ${figLabel(o)}`,
            () => select({ type: 'relation', id: r.id }), { small: true });
        })) : null,
      h('h3', {}, 'Kommentare zur Figur'),
      commentList(sc.session_id, ofFigure(f, 'kommentar'),
        { target_type: 'figure', target_id: f.id }, { readOnly, onChange: (items) => syncComments('figure', f.id, items) }),
      h('div.row.no-print', {}, btn('Perspektive einnehmen', () => setPersp(f.id), { small: true, iconName: 'eye' }),
        btn('In „Figuren“ bearbeiten', () => ctx.go('figuren'), { small: true })));
  }

  function relationCard(r) {
    const a = byId.get(r.a_id), b = byId.get(r.b_id);
    const p = pairOf(a.id, b.id);
    const save = debounce((data) => guard(api.patch(`/api/relations/${r.id}`, data)), 400);
    const set = (key, redraw) => (e) => { r[key] = e.target.value; save({ [key]: r[key] }); if (redraw) render(); };
    const levelSel = (key, opts) => h('select', { onchange: set(key) },
      opts.map((v) => h('option', { value: v, selected: r[key] === v ? true : null }, v || '–')));
    const aLooks = p.a === a.id ? p.a_looks_at_b : p.b_looks_at_a;
    const bLooks = p.a === a.id ? p.b_looks_at_a : p.a_looks_at_b;
    const gaze = aLooks && bLooks ? 'gegenseitig'
      : aLooks ? `${figLabel(a)} → ${figLabel(b)}` : bLooks ? `${figLabel(b)} → ${figLabel(a)}` : 'kein Blickkontakt';
    return h('section.card', {},
      h('div.detail-head', {}, h('h2.grow', {}, `${figLabel(a)} – ${figLabel(b)}`), closeBtn()),
      h('dl.kv', {}, h('dt', {}, 'Abstand'), h('dd', {}, `${p.distance_cm.toFixed(0)} cm`),
        h('dt', {}, 'Blick'), h('dd', {}, gaze)),
      h('div.fields', {},
        field('Beziehung', h('select', { onchange: set('kind', true) },
          Object.entries(KINDS).map(([key, k]) => h('option', { value: key, selected: r.kind === key ? true : null }, k.label)))),
        field('Dynamik', h('input', { value: r.dynamic, oninput: set('dynamic'), placeholder: 'z. B. Rückzug' })),
        field('Konflikt', levelSel('conflict', LEVELS)),
        field('Kommunikation', levelSel('communication', ['', 'gering', 'mittel', 'offen']))),
      field('Notiz', h('textarea', { rows: 2, value: r.notes, oninput: set('notes') })),
      h('h3', {}, 'Kommentare zur Beziehung'),
      commentList(sc.session_id, comments.filter((c) => c.target_type === 'relation' && c.target_id === r.id && c.kind === 'kommentar'),
        { target_type: 'relation', target_id: r.id }, { readOnly, onChange: (items) => syncComments('relation', r.id, items) }),
      h('div.row.no-print', {}, btn('Beziehung löschen', async () => {
        if (!await guard(api.del(`/api/relations/${r.id}`))) return;
        rels.splice(rels.indexOf(r), 1);
        select(null);
      }, { kind: 'danger', small: true, iconName: 'trash' })));
  }

  function summaryCard() {
    const lbl = (id) => figLabel(byId.get(id));
    const related = (x, y) => rels.some((r) => (r.a_id === x && r.b_id === y) || (r.a_id === y && r.b_id === x));
    const mutual = metrics.pairs.filter((p) => p.mutual_gaze).map((p) => `${lbl(p.a)} ↔ ${lbl(p.b)}`);

  const box = document.getElementById('userbox');
  box.replaceChildren(...(me?.user
    ? [h('span', {}, me.user), btn('Abmelden', logout, { small: true })]
    : []));
}

async function logout() {
  await api.post('/api/logout');
  me = null;
  renderUser();
  location.hash = '#/login';
}
