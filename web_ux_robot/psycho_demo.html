:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --surface-2: #e9eef4;
  --line: #d3dbe4;
  --text: #111c27;
  --text-2: #33414f;
  --accent: #1b6aa0;
  --accent-text: #ffffff;
  --accent-soft: #e0edf7;
  --danger: #b3261e;
  --ok: #2e7d4f;
  --warn: #9a6200;
  --wood: #e6d5b6;
  --wood-edge: #b29a72;
  --wood-side: #cdb68f;
  --shadow: 0 1px 2px rgb(16 28 40 / 6%);
  --radius: 8px;
  --font: Roboto, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --fs-sm: 13px;
  --fs-base: 15px;
  --fs-lg: 17px;
  --fs-xl: 21px;
  --tap: 44px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161b;
    --surface: #1a1f26;
    --surface-2: #242a33;
    --line: #2f3641;
    --text: #e9edf2;
    --text-2: #c4cbd4;
    --accent: #6ab4e0;
    --accent-text: #08141c;
    --accent-soft: #1d3447;
    --danger: #ff8a80;
    --ok: #7fd3a0;
    --warn: #f3c062;
    --wood: #8a6d47;
    --wood-edge: #5e4628;
    --wood-side: #6e5433;
    --shadow: none;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: var(--fs-base)/1.45 var(--font);
  -webkit-text-size-adjust: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
h1, h2, h3 { margin: 0; line-height: 1.25; font-weight: 600; letter-spacing: -.005em; }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-base); }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ── Kopfzeile: oben Marke, Bereiche, Nutzer – darunter der Pfad ──── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; flex-wrap: wrap; gap: 0 20px;
  padding: 0 max(16px, env(safe-area-inset-left));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  color: var(--text); text-decoration: none; font-weight: 700; font-size: var(--fs-lg); letter-spacing: -.01em;
}
.brand svg { width: 26px; height: 26px; fill: var(--accent); }
.mainnav { display: flex; align-self: stretch; }
.mainnav a {
  display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 16px;
  border-bottom: 3px solid transparent; color: var(--text); text-decoration: none; font-weight: 600;
}
.mainnav a:hover { border-bottom-color: var(--line); }
.mainnav a[aria-current="page"] { border-bottom-color: var(--accent); color: var(--accent); }
.topbar-end { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: var(--fs-sm); }
.crumbs {
  order: 3; flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 40px;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left))); padding: 0 max(16px, env(safe-area-inset-left));
  background: var(--surface-2); border-top: 1px solid var(--line); font-size: var(--fs-sm);
}
.crumbs:empty { display: none; }
.crumbs a, .crumbs span { padding: 4px 6px; border-radius: 6px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { background: var(--accent-soft); }
.crumbs .sep { padding: 4px 0; }

@media (max-width: 640px) {
  .brand { flex: 1; min-height: 48px; }
  .topbar-end { order: 1; }
  .topbar-end > span { display: none; }
  .mainnav { order: 2; flex: 1 1 100%; border-top: 1px solid var(--line); }
  .mainnav a { flex: 1; min-height: 44px; padding: 0 8px; }
  .toolbar .sep { display: none; }
  .toolbar { gap: 4px 12px; }
}

main { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 16px; outline: none; }

/* ── Bausteine ─────────────────────────────────────────────────────── */
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1 1 auto; }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.meta { font-size: var(--fs-sm); color: var(--text-2); }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line);
}
.badge.warn { border-color: var(--warn); color: var(--warn); }
.empty { padding: 24px; text-align: center; border: 2px dashed var(--line); border-radius: var(--radius); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--tap); padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font: 600 var(--fs-base) var(--font); cursor: pointer; text-decoration: none;
  touch-action: manipulation;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: var(--fs-sm); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: var(--fs-sm); font-weight: 600; }
input, select, textarea {
  font: var(--fs-base) var(--font); color: var(--text);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  min-height: var(--tap); padding: 8px 10px; width: 100%;
}
textarea { min-height: 88px; resize: vertical; }
input[type="color"] { padding: 4px; width: 64px; }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.check { display: flex; align-items: center; gap: 8px; min-height: var(--tap); cursor: pointer; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li + li { border-top: 1px solid var(--line); }
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px;
  color: var(--text); text-decoration: none; min-height: 56px;
}
.list-item:hover { background: var(--surface-2); }
.list-item .grow { min-width: 0; }
.list-item strong { display: block; }
.list-item > svg {
  width: 20px; height: 20px; flex: none; margin-left: auto;
  fill: none; stroke: currentColor; stroke-width: 2;
}
.thumb {
  width: 64px; height: 48px; border-radius: 8px; object-fit: cover; flex: none;
  background: var(--surface-2); border: 1px solid var(--line);
}

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab {
  min-height: var(--tap); padding: 0 14px; border: 0; background: none; color: var(--text);
  font: 600 var(--fs-base) var(--font); cursor: pointer; border-bottom: 3px solid transparent;
}
.tab[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent); }

/* ── Editor: Zeichenfläche + Seitenleiste ─────────────────────────── */
.workspace { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
@media (max-width: 900px) { .workspace { grid-template-columns: minmax(0, 1fr); } }
.canvas-wrap {
  position: relative; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; touch-action: none;
}
.canvas-wrap svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; align-self: stretch; background: var(--line); }
.hint { font-size: var(--fs-sm); padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); }

.side { position: sticky; top: 112px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 900px) { .side { position: static; } }

/* Detail-Karte (Figur / Beziehung) */
.detail-head { display: flex; align-items: center; gap: 10px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); flex: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: var(--fs-sm); }
.kv dt { font-weight: 700; }
.kv dd { margin: 0; }
.comments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.comment { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; display: flex; gap: 8px; align-items: flex-start; }
.comment p { flex: 1; white-space: pre-wrap; }
.comment .stamp { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: 2px; }
.comment .edit-c { flex: 1; }
.icon-btn {
  border: 0; background: none; color: var(--text); cursor: pointer;
  width: 36px; height: 36px; border-radius: 8px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--line); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

/* Legende der Beziehungsarten */
.legend { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); font-size: var(--fs-sm); }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-item svg { width: 44px; height: 14px; flex: none; }

/* SVG-Skizze: Farben aus den Tokens */
.sk-board { fill: var(--wood); stroke: var(--wood-edge); stroke-width: .4; }
.sk-board-side { fill: var(--wood-side); stroke: var(--wood-edge); stroke-width: .3; }
.sk-grid { stroke: var(--wood-edge); stroke-width: .08; opacity: .5; }
.sk-label { font: 600 1.7px var(--font); fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: .5px; stroke-linejoin: round; }
.sk-dist { font: 700 1.5px var(--font); fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: .45px; }
.sk-dist-line { stroke: var(--text); stroke-width: .15; stroke-dasharray: .6 .5; }
.sk-cone { fill: var(--accent); opacity: .16; stroke: var(--accent); stroke-width: .1; }
.sk-fig { cursor: pointer; }
.sk-fig .ring { fill: none; stroke: var(--accent); stroke-width: .5; opacity: 0; }
.sk-fig.selected .ring, .sk-fig.pick .ring { opacity: 1; }
.sk-fig.pick .ring { stroke-dasharray: .8 .5; }
.sk-rel { cursor: pointer; }
.sk-rel .hit { stroke: transparent; stroke-width: 2.4; fill: none; }
.sk-rel.selected .vis { filter: drop-shadow(0 0 .4px var(--accent)); }
.sk-rel.selected .hit { stroke: var(--accent); opacity: .18; }

/* Editor-Overlays */
.ed-corner { fill: var(--surface); stroke: var(--accent); cursor: grab; }
.ed-poly { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); }
.det-box { fill: color-mix(in srgb, var(--accent) 8%, transparent); stroke: var(--accent); }
.det-tag { fill: var(--accent); }
.det-text { fill: var(--accent-text); font-family: var(--font); font-weight: 700; }
.ed-fig { cursor: grab; }
.ed-fig .body { stroke: var(--surface); }
.ed-fig.suggest .body { stroke: var(--warn); stroke-dasharray: .7 .4; }
.ed-fig.selected .body { stroke: var(--accent); }
.ed-rot { fill: var(--surface); stroke: var(--accent); cursor: grab; }
.ed-arrow { stroke: var(--surface); fill: none; stroke-linecap: round; }

/* Anmeldung */
.auth { max-width: 380px; margin: 8vh auto 0; }

/* Meldungen */
#toast {
  position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 50; width: min(92vw, 420px);
}
.toast-msg {
  background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 10px;
  box-shadow: var(--shadow); font-weight: 600;
}
.toast-msg.error { background: var(--danger); color: #fff; }

/* Verlaufstabelle */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 700; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.trend-up, .trend-down { font-weight: 700; }

/* ── Akten-Dokumentation: IDs, Fälle, Personen, Versionen ─────────── */
.mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: var(--fs-sm); }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.badge.info { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge.st::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.badge.st.run::before { background: var(--ok); }
.badge.st.pause { border-color: var(--warn); color: var(--warn); }
.badge.st.pause::before { border-radius: 1px; width: 3px; box-shadow: 4px 0 0 currentColor; margin-right: 4px; }
.badge.st.first::before { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border: 1px solid var(--accent); }
.badge.st.done::before { content: '✓'; width: auto; height: auto; background: none; }
.cases > li { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sm); font-weight: 600;
}
.chip i, .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.dtable tbody tr:hover, .dtable tbody tr[aria-current] { background: var(--surface-2); }
.linkish {
  display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0;
  border: 0; background: none; color: var(--accent); font: 600 var(--fs-sm) var(--font); cursor: pointer;
}
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field-head > span { font-size: var(--fs-sm); font-weight: 600; }
.versions { display: flex; flex-direction: column; gap: 8px; }
.ver { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.ver.cur { border: 2px solid var(--accent); }
.ver p { white-space: pre-wrap; }
del { text-decoration: line-through; text-decoration-thickness: 2px; background: color-mix(in srgb, var(--danger) 12%, transparent); }
ins { text-decoration: none; background: color-mix(in srgb, var(--ok) 18%, transparent); border-bottom: 2px solid var(--ok); }
.dialog { width: 100%; max-width: 620px; margin: 0 auto; }
.kv.big { font-size: var(--fs-base); gap: 8px 16px; }
.check-row { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-sm); cursor: pointer; }
.check-row input { margin-top: 2px; }

/* ── Verwaltung: ID-Kette, Reiter, sortierbare Tabellen ──────────── */
.idchain { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.idchain .link {
  display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); min-width: 0;
}
.idchain .link b { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: var(--fs-sm); overflow-wrap: anywhere; }
.idchain .link span { font-size: var(--fs-sm); }
.idchain .link.cur { border-color: var(--accent); background: var(--accent-soft); }
.idchain .arr { align-self: center; font-weight: 700; }
.tab .count { font-variant-numeric: tabular-nums; font-weight: 500; }
.toolrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolrow input[type="search"] { flex: 1 1 220px; width: auto; }
.toolrow select { width: auto; }
.panel { gap: 12px; }
th.num { text-align: right; }
.sort {
  display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0;
  border: 0; background: none; color: inherit; font: inherit; font-weight: 700; cursor: pointer;
}
th[aria-sort] .sort { color: var(--accent); }
th[aria-sort="ascending"] .sort::after { content: '▲'; font-size: 11px; }
th[aria-sort="descending"] .sort::after { content: '▼'; font-size: 11px; }
.dtable td a.mono { font-weight: 600; }
.row-inline { display: inline-flex; align-items: center; gap: 8px; }
.bar {
  display: inline-block; width: 56px; height: 8px; margin-left: 6px; vertical-align: middle; overflow: hidden;
  border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line);
}
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.warn { border-color: var(--warn); }
.bar.warn i { background: var(--warn); }

/* ── Woche: Termine + Ausnahmen ───────────────────────────────────── */
.cols-week { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
@media (max-width: 900px) { .cols-week { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg a {
  display: inline-flex; align-items: center; justify-content: center; min-width: var(--tap); min-height: var(--tap);
  padding: 0 12px; background: var(--surface); color: var(--text); text-decoration: none; font-weight: 600;
}
.seg a + a { border-left: 1px solid var(--line); }
.seg a:hover { background: var(--surface-2); }
.seg a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.seg svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.btn .mono { font-weight: 700; }
.week {
  display: grid; grid-template-columns: 52px repeat(var(--days), minmax(0, 1fr));
  grid-template-rows: 34px repeat(var(--rows), 30px);
}
.week .dh { grid-row: 1; padding: 6px 8px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: var(--fs-sm); }
.week .dh.today { color: var(--accent); }
.week .hr {
  grid-column: 1; padding-right: 8px; text-align: right; transform: translateY(-8px);
  font-size: var(--fs-sm); font-variant-numeric: tabular-nums;
}
.week .cell { border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.week .cell.half { border-top-style: dotted; }
.week .ev {
  z-index: 1; min-width: 0; overflow: hidden; margin: 2px 4px; padding: 4px 8px;
  display: flex; flex-direction: column; gap: 1px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text); text-decoration: none;
  font-size: var(--fs-sm); line-height: 1.25;
}
.week .ev > * { flex: none; }
.week .ev:hover { border-color: var(--accent); }
.week .ev b { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: var(--fs-sm); }
.week .ev span, .week .ev strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week .ev.alert { border: 2px solid var(--warn); background: var(--surface); }
.week .ev.now { border: 2px solid var(--accent); background: var(--accent-soft); }
.flag { color: var(--warn); font-weight: 700; font-size: var(--fs-sm); }
.untimed { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.untimed .chip { text-decoration: none; color: var(--text); }
.agenda { display: none; list-style: none; margin: 0; padding: 0; flex-direction: column; gap: 12px; }
.agenda h3.today { color: var(--accent); }
.agenda .list-item .grow { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
@media (max-width: 700px) {
  .week-wrap, .untimed { display: none; }
  .agenda { display: flex; }
}
.att { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.att-item {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px;
  border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none;
}
.att-item:hover { background: var(--surface-2); }
.att-item .meta { overflow-wrap: anywhere; }
.att .ic {
  width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; border: 2px solid var(--warn); color: var(--warn);
}
.att .ic.info { border-color: var(--accent); color: var(--accent); }
.calm { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 16px; font-size: var(--fs-sm); }
.calm b { display: block; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }

/* ── System-Ring (Netzwerkkarte) ──────────────────────────────────── */
.ring-canvas { touch-action: none; }
.ring-canvas svg { display: block; width: 100%; max-width: 640px; height: auto; margin: 0 auto; user-select: none; -webkit-user-select: none; }
.ring .zone { fill: none; stroke: var(--line); stroke-width: 1.2; }
.ring .axis { stroke: var(--line); stroke-width: 1.2; }
.ring .zone-lbl { font: 600 13px var(--font); fill: var(--text-2); }
.ring .sector { font: 700 15px var(--font); fill: var(--text); }
.ring .center { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.ring .who { font: 700 15px var(--font); fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.ring .pid { font: 600 12px ui-monospace, Menlo, Consolas, monospace; fill: var(--text-2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.ring .rp { cursor: grab; outline: none; }
.ring .rp .hit { fill: transparent; }
.ring .rp .body { stroke: var(--surface); stroke-width: 3; }
.ring .rp .sel { fill: none; stroke: var(--accent); stroke-width: 2.5; opacity: 0; }
.ring .rp.selected .sel, .ring .rp:focus-visible .sel { opacity: 1; }
.ring .rp:focus-visible .sel { stroke-dasharray: 4 3; }
.ring .ghost { opacity: .6; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.tie { stroke-linecap: round; }
.tie.contact { stroke: var(--text-2); stroke-width: 1.2; opacity: .45; }
.tie.k-eng { stroke: var(--ok); stroke-width: 4; }
.tie.k-unterstuetzend { stroke: var(--accent); stroke-width: 2.5; }
.tie.k-neutral { stroke: var(--text-2); stroke-width: 1.5; }
.tie.k-distanziert { stroke: var(--text-2); stroke-width: 1.5; stroke-dasharray: 8 6; }
.tie.k-konflikt { stroke: var(--danger); stroke-width: 2.5; stroke-dasharray: 3 4; }
.tie.k-abgebrochen { stroke: var(--danger); stroke-width: 2.5; stroke-dasharray: 12 4 2 4; }
.ring-legend { gap: 8px; }
.ring-chip { cursor: grab; touch-action: none; min-height: 40px; color: var(--text); font: 600 var(--fs-sm) var(--font); }
.ring-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
@media (max-width: 640px) {
  .ring .who, .ring .sector { font-size: 21px; }
  .ring .pid, .ring .zone-lbl { font-size: 17px; }
  /* Reiter und ID-Kette seitlich wischen statt umbrechen */
  .tabs-scroll, .idchain { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  .tabs-scroll .tab, .idchain .link { flex: none; }
}

/* Druck: nur Skizze + Kopfdaten */
.print-only { display: none; }
/* ── Methoden (Stufe 3): Flächen, Perspektive, Vergleich, Zeitraffer ─── */
.sk-zone { fill: var(--surface); fill-opacity: .18; stroke: var(--wood-edge); stroke-width: .25; stroke-dasharray: .8 .5; }
polyline.sk-zone { fill: none; stroke-width: .35; }
.sk-zone-head { fill: var(--wood-edge); }
.sk-zone-lbl { font: 700 1.6px var(--font); fill: var(--text); paint-order: stroke; stroke: var(--wood); stroke-width: .5px; pointer-events: none; }
.sk-view { fill: var(--accent); opacity: .22; stroke: var(--accent); stroke-width: .15; }
.sk-dim { opacity: .3; }
.sk-ghost { opacity: .4; }
.sk-move { stroke: var(--accent); stroke-width: .4; fill: none; stroke-dasharray: 1 .6; }
.sk-move-head { fill: var(--accent); }
.sk-trail { fill: none; stroke-width: .3; stroke-dasharray: .5 .5; }
.sk-step { stroke: var(--surface); stroke-width: .2; }
.thumb.board { display: block; background: var(--wood); border-color: var(--wood-edge);
  background-image: linear-gradient(var(--wood-edge) 1px, transparent 1px), linear-gradient(90deg, var(--wood-edge) 1px, transparent 1px);
  background-size: 16px 16px; background-position: center; }
.canvas-wrap.small { max-width: 420px; }
.tpl-fig { cursor: grab; }
.tpl-fig:focus { outline: none; }
.tpl-fig:focus-visible > circle:first-of-type { stroke: var(--accent); stroke-width: .8; }

.seg button {
  display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 12px;
  border: 0; background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
}
.seg button + button, .seg a + a { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg.wrap { flex-wrap: wrap; }

.mgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); align-content: start; }
.mcard {
  display: flex; flex-direction: column; gap: 8px; padding: 12px; text-align: left; font: inherit; color: inherit;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer;
}
.mcard:hover { border-color: var(--accent); }
.mcard[aria-pressed="true"] { border: 2px solid var(--accent); padding: 11px; background: var(--accent-soft); }
.mcard svg { width: 100%; height: auto; border-radius: 8px; background: var(--surface-2); }
.mcard p, .mcard .src { font-size: var(--fs-sm); }
.mcard .src { font-weight: 600; }
.mcard .badge { align-self: flex-start; }

.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.qlist li { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: var(--fs-sm); display: flex; flex-direction: column; gap: 8px; }
.qlist li.open { background: var(--surface); border: 2px solid var(--accent); padding: 8px 10px; }
.qbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 0; border: 0; background: none;
  font: inherit; color: inherit; text-align: left; cursor: pointer; min-height: var(--tap); }
.qt { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.answer { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: var(--fs-sm); }
.quote { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-style: italic; }
.quote small { display: block; font-style: normal; font-weight: 600; font-size: var(--fs-sm); margin-top: 4px; }
.moves { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.moves li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; font-size: var(--fs-sm); }
.moves li i { width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; }
.moves b { font-size: var(--fs-base); }

.scale { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 180px) 32px; gap: 10px; align-items: center; font-size: var(--fs-sm); }
.scale input[type="range"], .player input[type="range"] { min-height: var(--tap); padding: 0; border: 0; background: none; accent-color: var(--accent); }
.scale input.unset { opacity: .45; }
.scale output { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
@media (max-width: 520px) { .scale { grid-template-columns: minmax(0, 1fr) 32px; } .scale input { grid-column: 1 / -1; grid-row: 2; } }
.sum { display: flex; justify-content: space-between; font-weight: 700; padding-top: 8px; border-top: 1px solid var(--line); }
.client .scale { font-size: var(--fs-base); }
.client { max-width: 760px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .lbl { font: 600 12px var(--font); fill: var(--text-2); }
.chart .ttl { font: 700 13px var(--font); fill: var(--text); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.chart .ln2 { fill: none; stroke: var(--ok); stroke-width: 2.5; stroke-dasharray: 7 4; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .pt2 { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.chart .val { font: 700 12px var(--font); fill: var(--text); }
.player { width: 100%; }
.player input[type="range"] { flex: 1 1 220px; }

.cols-3 { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1100px) { .cols-3 { grid-template-columns: minmax(0, 1fr); } }
.goal { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
.goal + .goal { border-top: 1px solid var(--line); }
.meter { width: 70px; height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.hyp { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.hyp li { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: var(--fs-sm); }
.hyp li.dropped .strong { text-decoration: line-through; }
.task { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; font-size: var(--fs-sm); }
.task + .task { border-top: 1px solid var(--line); }
.task > input[type="checkbox"] { margin-top: 10px; }
.inline { border-color: transparent; background: transparent; padding-left: 4px; padding-right: 4px; }
.inline:hover, .inline:focus { border-color: var(--line); background: var(--surface); }
textarea.inline { min-height: 0; resize: vertical; }
.inline.strong { font-weight: 700; }
.goal .row.spread, .hyp .row.spread, .task .row.spread { flex-wrap: nowrap; align-items: flex-start; }
.goal .row.spread > .inline, .hyp .row.spread > .inline, .task .row.spread > .inline { flex: 1 1 0; width: auto; min-width: 0; }
.hyp select, .toolbar select { width: auto; }
.edit-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.edit-q .edit-row { grid-template-columns: minmax(110px, 160px) minmax(0, 1fr) auto; }
.edit-q { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }

@media print {
  .topbar, .toolbar, .tabs, .no-print, #toast { display: none !important; }
  .print-only { display: block; }
  main { max-width: none; padding: 0; }
  .workspace { grid-template-columns: 1fr; }
  .card { box-shadow: none; break-inside: avoid; }
  body { background: #fff; }
}

/* ── Kamerabild: erkannte Figuren (Brett-Schritt) ─────────────────── */
.det-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.det-row {
  display: grid; grid-template-columns: 28px 24px minmax(0, 1fr) 84px 18px; gap: 8px; align-items: center;
  min-height: 44px; border-top: 1px solid var(--line);
}
.det-row:first-child { border-top: 0; }
.det-no {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-sm);
}
.det-icon { display: inline-flex; color: var(--text); }
.det-name { font-weight: 600; min-width: 0; }
.det-name small { display: block; font-weight: 400; font-size: var(--fs-sm); color: var(--text-2); }
.det-conf { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; font-variant-numeric: tabular-nums; }
.det-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.det-bar i { display: block; height: 100%; background: var(--accent); }
.det-ok { color: var(--ok); font-weight: 700; text-align: center; }

/* ── Demo-Leiste (nur in der Server-losen Demo) ───────────────────── */
.demo-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding: 6px max(16px, env(safe-area-inset-left));
  background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: var(--fs-sm);
}
@media print { .demo-bar { display: none !important; } }

  const hs = found.map((f) => f.height).sort((a, b) => a - b);
  const cut = hs.length >= 3 ? hs[Math.floor(hs.length / 3)] : 0;
  for (const f of found) {
    f.size = f.height < cut * 1.05 ? 'klein' : 'gross';
    delete f.height;
  }
  return found;
}

// ── Akten-Dokumentation (wie records.py) ───────────────────────────────

const RETENTION_YEARS = 10;
const AUDIT_MERGE_S = 60;
const VERSION_MERGE_S = 120;
const VERSIONED = { patients: ['notes'], sessions: ['notes'], cases: ['mandate'], comments: ['text'] };
const LABELS = { patients: 'Akte', cases: 'Fall', persons: 'Person', sessions: 'Sitzung', scenes: 'Aufstellung',
  figures: 'Figur', relations: 'Beziehung', comments: 'Kommentar', templates: 'Vorlage', goals: 'Ziel',
  hypotheses: 'Hypothese', tasks: 'Aufgabe' };
const PARENT = { cases: ['patients', 'patient_id'], persons: ['patients', 'patient_id'], sessions: ['cases', 'case_id'],
  scenes: ['sessions', 'session_id'], figures: ['scenes', 'scene_id'], relations: ['scenes', 'scene_id'],
  comments: ['sessions', 'session_id'], goals: ['cases', 'case_id'], hypotheses: ['cases', 'case_id'],
  tasks: ['cases', 'case_id'] };
const LOCKED = ['cases', 'sessions', 'scenes', 'figures', 'relations', 'comments', 'goals', 'hypotheses', 'tasks'];
const CLOSED = 'abgeschlossen';
const SETTINGS = ['Einzel', 'Paar', 'Familie', 'Gruppe'];
const STATUSES = ['erstgespraech', 'laufend', 'pausiert', CLOSED];
const CLOSE_REASONS = ['regulär beendet', 'vorzeitig beendet', 'abgebrochen', 'weiterverwiesen'];

const pad2 = (n) => String(n).padStart(2, '0');
const fmtRef = (code, f, s, a) => code + (f != null ? `-F${f}` : '') + (s != null ? `-S${pad2(s)}` : '')
  + (a != null ? `-A${a}` : '');
const personRef = (code, n) => `${code}-P${pad2(n)}`;
const ageS = (iso) => (Date.now() - new Date(iso).getTime()) / 1000;
const find = (table, id) => db[table].find((x) => x.id === id);

function chain(table, id) {
  const out = {};
  while (table && id != null) {
    const r = find(table, id);
    if (!r) break;
    out[table] = r;
    if (table === 'sessions' && r.case_id == null) { [table, id] = ['patients', r.patient_id]; continue; }
    const [pt, key] = PARENT[table] || [];
    [table, id] = [pt, key ? r[key] : null];
  }
  return out;
}

function refOf(table, id) {
  if (table === 'templates') return [null, `Vorlage ${id}`];
  const c = chain(table, id);
  const p = c.patients;
  if (!p) return [null, ''];
  if (c.persons) return [p.id, personRef(p.code, c.persons.number)];
  return [p.id, fmtRef(p.code, c.cases?.number, c.sessions?.number, c.scenes?.number)];
}

function log(action, table, id) {
  const [pid, ref] = refOf(table, id);
  const user = db.user || '';
  const last = db.audit.at(-1);
  if (last && last.action === action && last.ref === ref && last.user === user && ageS(last.at) < AUDIT_MERGE_S) {
    last.at = now();
    return;
  }
  insertRaw('audit', { at: now(), user, patient_id: pid, action, ref });
}

function insertRaw(table, values) {
  const id = (db.seq[table] = (db.seq[table] || 0) + 1);
  db[table].push({ ...values, id });
  return id;
}

function keepVersions(table, old, values) {
  const fields = (VERSIONED[table] || []).filter((f) => f in values);
  let changed = false;
  for (const f of fields) {
    const text = values[f] || '';
    if (text === old[f]) continue;
    changed = true;
    const [pid] = refOf(table, old.id);
    const user = db.user || ''; const t = now();
    const last = db.versions.filter((v) => v.tbl === table && v.row_id === old.id && v.field === f).at(-1);
    if (!last && old[f]) {
      insertRaw('versions', { patient_id: pid, tbl: table, row_id: old.id, field: f, text: old[f], user: '',
        created_at: old.created_at, updated_at: old.created_at });
    } else if (last && last.user === user && ageS(last.updated_at) < VERSION_MERGE_S) {
      Object.assign(last, { text, updated_at: t });
      continue;
    }
    insertRaw('versions', { patient_id: pid, tbl: table, row_id: old.id, field: f, text, user,
      created_at: t, updated_at: t });
  }
  return changed;
}

function ensureOpen(table, id) {
  const c = chain(table, id).cases;
  if (c && c.status === CLOSED) {
    throw new ApiError(409, `Fall ${refOf('cases', c.id)[1]} ist abgeschlossen – nur lesbar. `
      + 'Zum Ändern den Fall wieder öffnen.');
  }
}

function ensureParentOpen(table, values) {
  if (LOCKED.includes(table) && table !== 'cases') ensureOpen(PARENT[table][0], values[PARENT[table][1]]);
}

function retainUntil(iso) {
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  return `${y + RETENTION_YEARS}-${pad2(m)}-${pad2(m === 2 && d === 29 ? 28 : d)}`;
}

function caseRows(pred) {
  return db.cases.filter(pred).map((c) => {
    const p = find('patients', c.patient_id);
    const dates = db.sessions.filter((s) => s.case_id === c.id).map((s) => s.date).sort();
    return { ...clone(c), patient_code: p.code, patient_name: p.display_name, patient_archived: p.archived,
      session_count: dates.length, first_session: dates[0] ?? null, last_session: dates.at(-1) ?? null,
      ref: fmtRef(p.code, c.number) };
  }).sort((a, b) => a.patient_code.localeCompare(b.patient_code) || a.number - b.number);
}

function personRows(pid) {
  const p = find('patients', pid);
  const seen = {};
  for (const f of db.figures) {
    if (f.person_id == null) continue;
    const c = chain('figures', f.id);
    if (c.patients?.id !== pid) continue;
    const key = `${c.cases?.number}|${c.sessions.number}`;
    (seen[f.person_id] ??= new Map()).set(key, [c.cases?.number ?? null, c.sessions.number]);
  }
  return db.persons.filter((pe) => pe.patient_id === pid).sort((a, b) => a.number - b.number)
    .map((pe) => ({ ...clone(pe), patient_code: p.code, ref: personRef(p.code, pe.number),
      seen: [...(seen[pe.id]?.values() || [])].sort((a, b) => (a[0] - b[0]) || (a[1] - b[1])) }));
}

function caseError(v) {
  if ('setting' in v && !SETTINGS.includes(v.setting)) return 'Unbekanntes Setting';
  if ('status' in v && !STATUSES.includes(v.status)) return 'Unbekannter Status';
  if (v.status === CLOSED) return 'Abschließen nur über „Fall abschließen“';
  if (v.quota != null) {
    v.quota = Number(v.quota);
    if (!Number.isInteger(v.quota)) return 'Kontingent ist keine Zahl';
    if (v.quota < 1 || v.quota > 300) return 'Kontingent zwischen 1 und 300 Sitzungen';
  }
  return null;
}

function foreignPerson(scid, v) {
  if (v.person_id == null) return;
  const pe = find('persons', v.person_id);
  if (!pe || pe.patient_id !== chain('scenes', scid).patients?.id) {
    throw new ApiError(400, 'Diese Person gehört nicht zu dieser Akte');
  }
}

const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;

/** Wie session_error in api.py: Uhrzeit HH:MM oder leer; Skalen wie methods.clean_scales. */
function sessionError(v) {
  if ('scales' in v) v.scales = cleanScales(v.scales);
  if (!('time' in v)) return;
  v.time = String(v.time ?? '').trim() || null;
  if (v.time && !TIME_RE.test(v.time)) throw new ApiError(400, 'Uhrzeit als HH:MM angeben, z. B. 14:00');
}

// ── Methoden (wie methods.py / api_methods.py) ─────────────────────────

const SCENE_KINDS = ['ist', 'ziel', 'loesung'];
const COMMENT_KINDS = ['kommentar', 'ich', 'antwort'];
const LAYOUTS = ['', 'tetralemma', 'netzwerk', 'zeitlinie'];
const QUESTION_KINDS = ['aufstellung', 'zirkulaer', 'loesung', 'ausnahme', 'ressource'];
const HYP_STATUS = ['offen', 'gestützt', 'verworfen'];
const bad = (msg) => new ApiError(400, msg);

function text(v, limit, name, required = false) {
  const t = String(v ?? '').trim();
  if (required && !t) throw bad(`${name} fehlt`);
  if (t.length > limit) throw bad(`${name} ist zu lang (höchstens ${limit} Zeichen)`);
  return t;
}
const frac = (v) => (v === null || v === undefined || v === '' || Number.isNaN(Number(v)) ? null
  : Math.round(Math.min(1, Math.max(0, Number(v))) * 1000) / 1000);
const int010 = (x) => typeof x === 'number' && Number.isInteger(x) && x >= 0 && x <= 10;

function cleanTemplate(v) {
  if ('name' in v) v.name = text(v.name, 80, 'Name', true);
  if ('description' in v) v.description = text(v.description, 300, 'Description');
  if ('source' in v) v.source = text(v.source, 120, 'Source');
  if ('persons' in v) v.persons = v.persons ? 1 : 0;
  if ('layout' in v && !LAYOUTS.includes(v.layout)) throw bad('Unbekannte Flächen auf dem Brett');
  if ('figures' in v) {
    if (!Array.isArray(v.figures) || v.figures.length > 20) throw bad('Höchstens 20 Figuren');
    v.figures = v.figures.map((f) => {
      if (!f || typeof f !== 'object') throw bad('Figur ohne Angaben');
      const color = String(f.color || '#4f7cac');
      if (!/^#[0-9a-fA-F]{6}$/.test(color)) throw bad('Farbe als #rrggbb angeben');
      return { label: text(f.label, 40, 'Name der Figur', true), color, size: f.size === 'klein' ? 'klein' : 'gross',
        x: frac(f.x), y: frac(f.y) };
    });
  }
  if ('questions' in v) {
    if (!Array.isArray(v.questions) || v.questions.length > 60) throw bad('Höchstens 60 Leitfragen');
    v.questions = v.questions.map((q) => {
      if (!q || !QUESTION_KINDS.includes(q.kind)) throw bad('Unbekannte Art der Leitfrage');
      return { kind: q.kind, title: text(q.title, 60, 'Titel'), text: text(q.text, 400, 'Leitfrage', true) };
    });
  }
  return v;
}

function cleanScales(s) {
  if (s === null || s === undefined) return null;
  if (typeof s !== 'object' || Array.isArray(s)) throw bad('Skalen ohne Angaben');
  const val = (x) => {
    if (x === null || x === undefined || x === '') return null;
    if (!int010(x)) throw bad('Skalenwerte sind ganze Zahlen von 0 bis 10');
    return x;
  };
  const out = {};
  for (const k of ['start', 'end']) {
    const items = s[k] || [null, null, null, null];
    if (!Array.isArray(items) || items.length !== 4) throw bad('Es braucht genau 4 Werte');
    out[k] = items.map(val);
  }
  out.scale = val(s.scale);
  out.note = text(s.note, 500, 'Notiz zur Skala');
  return { start: out.start, scale: out.scale, note: out.note, end: out.end };
}

const PLAN_REQUIRED = { goals: 'text', hypotheses: 'text', tasks: 'title' };
function cleanPlan(table, cid, v, creating) {
  const req = PLAN_REQUIRED[table];
  if (creating || req in v) v[req] = text(v[req], 300, req === 'text' ? 'Text' : 'Titel', true);
  for (const [k, n] of [['criterion', 300], ['note', 300], ['text', 1000]]) if (k in v && k !== req) v[k] = text(v[k], n, 'Text');
  if ('scale' in v && v.scale !== null && !int010(v.scale)) throw bad('Skala ist eine ganze Zahl von 0 bis 10');
  if ('status' in v) {
    if (!HYP_STATUS.includes(v.status)) throw bad('Unbekannter Status');
    v.status_at = today();
  }
  if ('done' in v) { v.done = v.done ? 1 : 0; v.done_at = v.done ? today() : null; }
  if (v.session_id != null && !db.sessions.some((s) => s.id === v.session_id && s.case_id === cid)) {
    throw bad('Diese Sitzung gehört nicht zu diesem Fall');
  }
  return v;
}

/** Verlauf der Ziel-Skala wie _keep_scale in api_methods.py: ein Wert je Tag. */
function keepScale(gid, v) {
  if (v.scale == null) return;
  const day = today();
  const r = db.goal_scales.find((x) => x.goal_id === gid && x.day === day);
  if (r) r.value = v.scale;
  else insertRaw('goal_scales', { goal_id: gid, day, value: v.scale });
}

const templateRows = () => [...db.templates].sort((a, b) => (b.builtin - a.builtin) || (a.position - b.position) || (a.id - b.id))
  .map((t) => ({ ...clone(t), used: db.scenes.filter((sc) => sc.template_id === t.id).length }));

function sceneTemplate(tid) {
  return clone((tid != null && find('templates', tid)) || db.templates.find((t) => t.key === 'familienbrett') || null);
}

const facing = (x, y, cx, cy) => Math.round((Math.atan2(cy - y, cx - x) * 180) / Math.PI);
const r1 = (v) => Math.round(v * 10) / 10;

/** Wie template_figures in api.py. */
function templateFigures(tpl, pid, w, h) {
  const cx = w / 2; const cy = h / 2;
  const out = tpl.figures.map((f) => {
    const x = (f.x ?? 0.5) * w; const y = (f.y ?? 0.5) * h;
    return { person_id: null, bx: r1(x), by: r1(y), angle: x === cx && y === cy ? -90 : facing(x, y, cx, cy),
      role: f.label, name: '', age: '', size: f.size, color: f.color };
  });
  if (!tpl.persons) return out;
  const persons = db.persons.filter((pe) => pe.patient_id === pid).sort((a, b) => a.number - b.number);
  let places;
  if (tpl.layout === 'netzwerk') {
    const r = (Math.min(w, h) / 2) * 0.92;
    places = persons.filter((pe) => pe.ring_x != null).map((pe) => [pe, cx + pe.ring_x * r, cy + pe.ring_y * r]);
  } else {
    const r = Math.min(w, h) * 0.32;
    places = persons.map((pe, i) => {
      const a = ((-90 + (360 * i) / persons.length) * Math.PI) / 180;
      return [pe, cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
  }
  for (const [pe, x, y] of places) {
    out.push({ person_id: pe.id, bx: r1(x), by: r1(y), angle: facing(x, y, cx, cy), role: pe.role, name: pe.name,
      age: pe.age, size: pe.size, color: pe.color });
  }
  return out;
}

/** Hauptbild einer Sitzung wie records.MAIN_SCENE: letztes Ist-Bild, sonst letzte Aufstellung. */
const mainScene = (sid) => db.scenes.filter((x) => x.session_id === sid)
  .sort((a, b) => ((b.kind === 'ist') - (a.kind === 'ist')) || (b.number - a.number) || (b.id - a.id))[0];

/** Wie person_error in api_cases.py: x und y zusammen oder beide leer; außerhalb → Rand. */
function personError(v) {
  if (!('ring_x' in v) && !('ring_y' in v)) return;
  const { ring_x: x, ring_y: y } = v;
  if (x == null && y == null) { v.ring_x = null; v.ring_y = null; return; }
  const bad = () => new ApiError(400, 'Platz im Ring braucht x und y');
  if (x == null || y == null || x === '' || y === '') throw bad();
  const [nx, ny] = [Number(x), Number(y)];
  const r = Math.hypot(nx, ny);
  if (!Number.isFinite(r)) throw bad();
  const k = r > 1 ? r : 1;
  v.ring_x = Math.round((nx / k) * 1e4) / 1e4;
  v.ring_y = Math.round((ny / k) * 1e4) / 1e4;
}

const sessionRef = (s) => fmtRef(find('patients', s.patient_id).code, find('cases', s.case_id)?.number, s.number);
const nextNumber = (rows) => Math.max(0, ...rows.map((r) => r.number)) + 1;

// ── Verwaltung, Woche, System-Ring (wie api_admin.py) ─────────────────

const QUOTA_WARN = 2;
const IDLE_DAYS = 42;
const RETENTION_WARN_DAYS = 90;
const DURATION = { Einzel: 50, Paar: 90, Familie: 90, Gruppe: 90 };
const ATTENTION_ORDER = ['quota', 'unmarked', 'idle', 'retention'];
const today = () => now().slice(0, 10);
const addDays = (iso, n) => new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10) + n))
  .toISOString().slice(0, 10);

function sessionRows() {
  return db.sessions.map((s) => {
    const p = find('patients', s.patient_id);
    const c = find('cases', s.case_id);
    const scenes = db.scenes.filter((x) => x.session_id === s.id);
    return { id: s.id, patient_id: s.patient_id, case_id: s.case_id, number: s.number, date: s.date,
      time: s.time ?? null, title: s.title, patient_code: p.code, patient_name: p.display_name,
      case_number: c?.number ?? null, setting: c?.setting ?? null, case_status: c?.status ?? null,
      scene_count: scenes.length, unmarked: scenes.filter((x) => !x.topview && x.photo).length,
      ref: fmtRef(p.code, c?.number, s.number), duration: DURATION[c?.setting] ?? DURATION.Einzel };
  }).sort((a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '')
    || a.patient_code.localeCompare(b.patient_code));
}

const upcoming = (sessions, t) => sessions.filter((s) => s.date > t || (s.date === t && !s.scene_count));

function attention(t) {
  const out = [];
  const idleSince = addDays(t, -IDLE_DAYS);
  const retentionBy = addDays(t, RETENTION_WARN_DAYS);
  for (const c of caseRows(() => true)) {
    const base = { ref: c.ref, case_id: c.id, patient_id: c.patient_id };
    if (c.status === CLOSED) {
      if (c.retain_until && c.retain_until <= retentionBy) out.push({ ...base, type: 'retention', date: c.retain_until });
      continue;
    }
    if (c.quota && c.quota - c.session_count <= QUOTA_WARN) {
      out.push({ ...base, type: 'quota', count: c.session_count, quota: c.quota });
    }
    if ((c.last_session || c.created_at.slice(0, 10)) < idleSince) {
      out.push({ ...base, type: 'idle', date: c.last_session, status: c.status });
    }
  }
  for (const sc of db.scenes.filter((x) => !x.topview && x.photo)) {
    const ch = chain('scenes', sc.id);
    if (ch.cases?.status === CLOSED) continue;
    out.push({ type: 'unmarked', scene_id: sc.id, case_id: ch.cases?.id ?? null, patient_id: ch.patients.id,
      ref: fmtRef(ch.patients.code, ch.cases?.number, ch.sessions.number, sc.number) });
  }
  return out.sort((a, b) => (ATTENTION_ORDER.indexOf(a.type) - ATTENTION_ORDER.indexOf(b.type))
    || a.ref.localeCompare(b.ref));
}

function adminOverview() {
  const t = today();
  const sessions = sessionRows();
  const nxt = new Map();
  for (const s of upcoming(sessions, t)) if (!nxt.has(s.case_id)) nxt.set(s.case_id, s);
  const cases = caseRows(() => true).map((c) => ({ ...c, next_date: nxt.get(c.id)?.date ?? null,
    next_time: nxt.get(c.id)?.time ?? null }));
  const persons = [];
  const patients = [...db.patients].sort((a, b) => a.code.localeCompare(b.code)).map((p) => {
    const mine = personRows(p.id).map((pe) => ({ ...pe, patient_name: p.display_name }));
    persons.push(...mine);
    const cs = cases.filter((c) => c.patient_id === p.id);
    const ss = sessions.filter((s) => s.patient_id === p.id);
    const open = cs.filter((c) => c.status !== CLOSED);
    return { id: p.id, code: p.code, display_name: p.display_name, archived: p.archived, created_at: p.created_at,
      case_count: cs.length, session_count: ss.length, person_count: mine.length,
      open_case: open.length ? { ref: open.at(-1).ref, status: open.at(-1).status } : null,
      last_session: ss.map((s) => s.date).filter((d) => d <= t).sort().at(-1) ?? null };
  });
  const unassigned = db.figures.filter((f) => f.person_id == null && f.source !== 'vorschlag').map((f) => {
    const ch = chain('figures', f.id);
    const p = ch.patients;
    return { id: f.id, role: f.role, name: f.name, color: f.color, source: f.source, scene_id: ch.scenes.id,
      scene_number: ch.scenes.number, session_id: ch.sessions.id, session_number: ch.sessions.number,
      date: ch.sessions.date, case_number: ch.cases?.number ?? null, case_status: ch.cases?.status ?? null,
      patient_id: p.id, patient_code: p.code, patient_name: p.display_name,
      ref: fmtRef(p.code, ch.cases?.number, ch.sessions.number, ch.scenes.number) };
  }).sort((a, b) => a.ref.localeCompare(b.ref) || a.id - b.id);
  const audit = [...db.audit].reverse().slice(0, 1000).map((a) => {
    const p = find('patients', a.patient_id);
    return { ...a, patient_name: p?.display_name ?? null, patient_exists: p ? 1 : 0 };
  });
  return { today: t, patients, cases, sessions, persons, unassigned, audit, templates: templateRows() };
}

function adminWeek(url) {
  const t = today();
  const day = new URL(url, 'http://demo').searchParams.get('start') || t;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || Number.isNaN(Date.parse(day))) {
    throw new ApiError(400, 'Datum als JJJJ-MM-TT angeben');
  }
  const start = addDays(day, -((new Date(`${day}T12:00:00Z`).getUTCDay() + 6) % 7));
  const end = addDays(start, 6);
  const sessions = sessionRows();
  const nxt = upcoming(sessions, t);
  const cases = caseRows(() => true);
  const inWeek = sessions.filter((s) => s.date >= start && s.date <= end);
  return { today: t, start, sessions: inWeek, next: nxt[0] ?? null, attention: attention(t),
    open_cases: cases.filter((c) => c.status !== CLOSED && !c.patient_archived).map((c) => ({ id: c.id,
      patient_id: c.patient_id, ref: c.ref, patient_name: c.patient_name, setting: c.setting })),
    counts: { running: cases.filter((c) => c.status === 'laufend').length, week: inWeek.length,
      first: cases.filter((c) => c.status === 'erstgespraech').length } };
}

function ring(pid) {
  const p = one('patients', pid);
  const caseNo = (s) => find('cases', s.case_id)?.number ?? 0;
  const last = db.scenes.map((sc) => ({ sc, s: find('sessions', sc.session_id) }))
    .filter(({ s }) => s.patient_id === pid)
    .sort((a, b) => (caseNo(b.s) - caseNo(a.s)) || (b.s.number - a.s.number)
      || ((b.sc.kind === 'ist') - (a.sc.kind === 'ist')) || (b.sc.number - a.sc.number))[0];
  const ties = [];
