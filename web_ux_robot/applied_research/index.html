<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KreiswertS</title>
<meta name="description" content="KreiswertS – digitaler Plattform-Prototyp für den zirkulären Kunststoff-Materialaustausch in Kamp-Lintfort. Alle Unternehmen und Mengen sind fiktive Demo-Daten.">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="kreiswerts.css">
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <a class="brand" href="#start"><svg viewBox="0 0 32 32" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10A6 6 0 1 0 16 16A6 6 0 1 1 10 22"/><circle cx="22" cy="10" r="2.6" fill="var(--accent)" stroke="none"/><path d="M7 24.6 10 21.2 13 24.6"/></svg>KreiswertS</a>
  <nav class="rail" id="rail" data-ta="railAria"></nav>
  <div class="tools">
    <span class="bdg demo" data-t="demo"></span>
    <div class="seg" role="group" data-ta="langAria">
      <button type="button" data-lang="de" lang="de">DE</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <button type="button" class="iconbtn" id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path id="themeIc" d=""/></svg></button>
  </div>
</div></header>

<main class="wrap">

<section class="area" id="start">
  <div class="bento">
    <div class="tile t-intro">
      <div class="i-name">
        <div class="row"><span class="bdg" data-t="eyebrow"></span><span class="bdg demo" data-t="demo"></span></div>
        <h1>KreiswertS</h1>
        <p class="sub" data-t="title"></p>
      </div>
      <div class="i-text">
        <p class="lead" data-t="lead"></p>
        <div class="explain"><b data-t="canTitle"></b><ol><li data-t="can1"></li><li data-t="can2"></li><li data-t="can3"></li></ol></div>
        <div class="row">
          <a class="btn pri" href="#prinzip"><span data-t="ctaNext"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
          <a class="btn" href="#plattform"><span data-t="ctaPlat"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </div>
    <div class="tile t-map">
      <div class="bar"><span class="bt"><span class="hic" data-ic="map" aria-hidden="true"></span><strong data-t="mapTitle"></strong></span><span class="legend" id="legendStart"></span></div>
      <div class="stage"><svg class="map" id="mapStart" role="img"></svg></div>
      <div class="overlay">
        <div><span class="lab" data-t="potLabel"></span><br><span class="num" id="pot">–</span><span class="unit" data-t="perMonth"></span><br><span class="lab" data-t="potNote"></span></div>
        <span class="chips" id="polyLegend"></span>
      </div>
    </div>
    <div class="tile k"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M3 21V9l6-4v4l6-4v16M15 21V11h6v10"/></svg></span><div><span class="num" id="kFirms"></span><span class="lab" id="kFirmsL"></span></div></div>
    <div class="tile k hd-out"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span><div><span class="num" id="kOffers"></span><span class="lab" id="kOffersL"></span></div></div>
    <div class="tile k hd-tst"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span><div><span class="num" id="kNeeds"></span><span class="lab" id="kNeedsL"></span></div></div>
    <div class="tile k hd-per"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 12h6"/></svg></span><div><span class="num" id="kPairs"></span><span class="lab" data-t="kPairs"></span></div></div>
  </div>
</section>


<section class="area" id="prinzip">
  <div class="head"><div><span class="medal" aria-hidden="true"><b>02</b></span><span class="kicker" data-kicker="1"></span><h2 data-t="prTitle"></h2><p data-t="prLead"></p></div></div>
  <div class="pr-grid">
    <div class="tile t-problem hd hd-out">
      <h3><span class="hic" data-ic="alert" aria-hidden="true"></span><span data-t="problem"></span></h3>
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-t="pb1"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><span data-t="pb2"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 14h6v6h-6zM14 4h6v6h-6z"/></svg><span data-t="pb3"></span></li>
      </ul>
      <p class="fix" data-t="fix"></p>
    </div>
    <figure class="tile t-cycle hd">
      <h3><span class="hic" data-ic="run" aria-hidden="true"></span><span data-t="cyTitle"></span></h3>
      <svg id="cycle" viewBox="70 40 640 520" role="img"></svg>
      <figcaption class="cy-legend"><span><i></i><span data-t="cyLoop"></span></span><span><i class="fwd"></i><span data-t="cyFwd"></span></span><span class="pz-hint" id="cyHint"></span></figcaption>
    </figure>
    <div class="tile vs hd hd-tst"><h3><span class="hic" data-ic="arrow" aria-hidden="true"></span><span data-t="vsToday"></span></h3><svg id="vsToday" viewBox="0 0 520 198" aria-hidden="true"></svg><ul id="vsTodayL"></ul></div>
    <div class="tile vs hd"><h3><span class="hic" data-ic="link" aria-hidden="true"></span><span data-t="vsNet"></span></h3><svg id="vsNet" viewBox="0 0 520 198" aria-hidden="true"></svg><ul id="vsNetL"></ul></div>
  </div>
</section>


<section class="area" id="plattform">
  <div class="head"><div><span class="medal" aria-hidden="true"><b>03</b></span><span class="kicker" data-kicker="2"></span><h2 data-t="plTitle"></h2><p data-t="plLead"></p></div></div>
  <div class="search" role="search">
    <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr-only" data-t="searchLabel"></span><input type="search" id="q" data-tp="searchPh" autocomplete="off" spellcheck="false"></label>
    <div class="chipgrp" role="group" data-ta="role"><span class="gl" data-t="role" aria-hidden="true"></span><span class="chipgrp" id="roleChips"></span></div>
    <div class="chipgrp" role="group" data-ta="type"><span class="gl" data-t="type" aria-hidden="true"></span>
      <button type="button" class="chip" data-type="o" data-t="offers"></button>
      <button type="button" class="chip" data-type="n" data-t="needs"></button>
      <button type="button" class="chip" id="gapChip" data-t="gapsOnly"></button>
    </div>
    <span class="bdg" id="hits" aria-live="polite"></span>
  </div>
  <div class="plat">
    <div class="tile mapc">
      <div class="stage"><svg class="map" id="mapPlat" role="group"></svg></div>
      <div class="hint"><span data-t="mapHint"></span><span id="geoHint"></span><span class="legend" id="legendPlat"></span></div>
    </div>
    <div class="tile panel">
      <div class="tabs" role="tablist" id="ptabs">
        <button type="button" role="tab" id="tab-firms" data-tab="firms" aria-controls="pbody"></button>
        <button type="button" role="tab" id="tab-board" data-tab="board" aria-controls="pbody"></button>
        <button type="button" role="tab" id="tab-match" data-tab="match" aria-controls="pbody"></button>
      </div>
      <div class="pbody" id="pbody" role="tabpanel"></div>
    </div>
  </div>
</section>


<section class="area" id="szenarien">
  <div class="head"><div><span class="medal" aria-hidden="true"><b>04</b></span><span class="kicker" data-kicker="3"></span><h2 data-t="scTitle"></h2><p data-t="scLead"></p></div><div class="scn-tabs" role="tablist" id="scnTabs"></div></div>
  <div class="story">
    <div class="steps" id="steps"></div>
    <div class="tile stagemap"><div class="stage"><svg class="map" id="mapScn" role="img"></svg></div><div class="cap" id="scnCap"></div></div>
  </div>
</section>


<section class="area" id="projekt">
  <div class="head"><div><span class="medal" aria-hidden="true"><b>05</b></span><span class="kicker" data-kicker="4"></span><h2 data-t="pjTitle"></h2><p data-t="pjLead"></p></div><div class="lg" id="legend" role="group" data-ta="legendAria"></div></div>
  <div class="pgrid">
    <div class="tile phases"><h3><span class="hic" data-ic="flag" aria-hidden="true"></span><span data-t="phTitle"></span><span class="now" id="phNow"></span></h3><div class="pt" id="pt"></div></div>
    <div class="tile sollist"><h3><span class="hic" data-ic="target" aria-hidden="true"></span><span data-t="goalsTitle"></span></h3>
      <div class="tscroll"><table><thead><tr><th data-t="thGoal"></th><th data-t="thSoll"></th><th data-t="thIst"></th><th data-t="thSt"></th></tr></thead><tbody id="goals"></tbody></table></div></div>
    <div class="tile succ"><h3><span class="hic" data-ic="check" aria-hidden="true"></span><span data-t="succTitle"></span></h3><p class="crit" data-t="succCrit"></p>
      <div class="cols"><div><p class="lab" data-t="succShows"></p><ul class="ticks" id="succY"></ul></div><div><p class="lab" data-t="succNeeds"></p><ul class="ticks" id="succO"></ul></div></div></div>
    <div class="tile outs"><h3><span class="hic" data-ic="file" aria-hidden="true"></span><span data-t="outTitle"></span></h3><div class="ob" id="outs"></div></div>
    <div class="tile eval" id="selftest">
      <div class="hb"><span class="hic" data-ic="flask" aria-hidden="true"></span>
        <div class="tt"><h3 id="testTitle"></h3><p data-t="testLead"></p></div>
        <div class="score"><b id="testScore"></b><span><strong id="testWord"></strong><small id="testStamp"></small></span></div></div>
      <ul class="tests" id="tests" aria-live="polite"></ul>
      <div class="row"><button type="button" class="btn pri" id="testRun"></button><button type="button" class="btn" id="testSave"></button></div></div>
    <div class="tile personas"><h3><span class="hic" data-ic="users" aria-hidden="true"></span><span data-t="perTitle"></span></h3><p class="lab" data-t="perLead"></p><div class="pgrid4" id="personas"></div></div>
  </div>
</section>


<section class="area" id="einordnung">
  <div class="head"><div><span class="medal" aria-hidden="true"><b>06</b></span><span class="kicker" data-kicker="5"></span><h2 data-t="ctxTitle"></h2><p data-t="ctxLead"></p></div><div class="lg" id="ctxLegend" role="group" data-ta="ctxLgAria"></div></div>
  <div class="egrid">
    <div class="tile sota hd hd-out"><h3><span class="hic" data-ic="layers" aria-hidden="true"></span><span data-t="sotaTitle"></span></h3><p class="lab" data-t="sotaLead"></p>
      <div class="tscroll"><table><thead><tr><th data-t="thPlat"></th><th data-t="thBy"></th><th data-t="thAccess"></th><th data-t="thPlus"></th><th data-t="thGap"></th></tr></thead><tbody id="sota"></tbody></table></div></div>
    <div class="tile gap hd"><h3><span class="hic" data-ic="check" aria-hidden="true"></span><span data-t="gapTitle"></span></h3><ul class="ticks" id="gapList"></ul></div>
    <div class="tile lim hd hd-tst"><h3><span class="hic" data-ic="alert" aria-hidden="true"></span><span data-t="limTitle"></span></h3><ul class="ticks" id="limList"></ul></div>
    <div class="tile guide hd hd-per"><h3><span class="hic" data-ic="book" aria-hidden="true"></span><span id="guideTitle"></span></h3><p class="lab" data-t="guideLead"></p><ol class="rsteps" id="rsteps"></ol></div>
  </div>
</section>

<section class="area" id="funktionen">
  <div class="head"><div><span class="medal" aria-hidden="true"><b>07</b></span><span class="kicker" data-kicker="6"></span><h2 data-t="fnTitle"></h2><p data-t="fnLead"></p></div><div class="lg" id="fnLegend" role="group" data-ta="fnLgAria"></div></div>
  <div class="tile fmatrix"><div class="tscroll"><table><thead><tr id="fnHead"></tr></thead><tbody id="fnRows"></tbody></table></div></div>
</section>
</main>
<footer class="foot"><div class="wrap" data-t="foot"></div></footer>
<script src="daten.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="app.js"></script>
</body>
</html>
