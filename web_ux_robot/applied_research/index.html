<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materialfluss Kehrum</title>
<meta name="description" content="Interaktive Karte der Materialflüsse im Industriepark Kehrum (Kalkar) – Prototyp mit fiktiven Demo-Daten.">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ee; --surface: #fcfcfb; --surface-2: #efede6;
  --ink: #141412; --ink-2: #3a3935; --line: #d9d6cc; --line-2: #c4c0b4;
  --map-bg: #f7f6f1; --field: #e6e3d8; --park: #eeede6; --plot: #e4e1d6; --road: #d6d2c6; --road-mid: #f7f6f1;
  --accent: #1f5fae;
  /* Materialfarben = Referenz-Palette (dataviz), Slots 1–5 + 7 */
  --m-metall: #2a78d6; --m-holz: #eb6834; --m-organik: #1baf7a; --m-mineral: #eda100; --m-kunst: #e87ba4; --m-energie: #6250d6; --m-rest: #6f6d66;
  /* Zustände: Potenzial/neu = grün, Reststoff = bernstein, entfällt/Verbrennung = rot */
  --ok: #1d8a57; --on-ok: #fff; --warn: #b26b00; --bad: #c2412d; --info: #1f6fb8;
  /* Branchen (nur Variante „Branchenfarben“) */
  --c-mp: #9a6b1f; --c-h: #2c7a7b; --c-hl: #8a4f7d; --c-r: #5d7f2a; --c-e: #a34b3a;
  --ease-out: cubic-bezier(.22,.61,.36,1); --ease-io: cubic-bezier(.65,0,.35,1);
  --t-fast: 150ms; --t-base: 250ms; --t-slow: 450ms; --t-xfade: 900ms; --t-pulse: 2.6s; --t-ping: 1.2s;
  --radius-sm: 4px; --radius: 6px; --radius-lg: 8px;
  --stick: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #242422;
    --ink: #f0efec; --ink-2: #d2d0c6; --line: #33322e; --line-2: #4a4943;
    --map-bg: #161615; --field: #1e1e1c; --park: #1b1b19; --plot: #262624; --road: #2f2e2b; --road-mid: #45443f;
    --accent: #7fb0f0;
    --m-metall: #3987e5; --m-holz: #d95926; --m-organik: #199e70; --m-mineral: #c98500; --m-kunst: #d55181; --m-energie: #9085e9; --m-rest: #9a988f;
    --ok: #4cc48a; --on-ok: #08140e; --warn: #e3a338; --bad: #ef7a64; --info: #7fb0f0;
    --c-mp: #d1a052; --c-h: #5bb5b5; --c-hl: #c58ab8; --c-r: #9cc160; --c-e: #e08574;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #242422;
  --ink: #f0efec; --ink-2: #d2d0c6; --line: #33322e; --line-2: #4a4943;
  --map-bg: #161615; --field: #1e1e1c; --park: #1b1b19; --plot: #262624; --road: #2f2e2b; --road-mid: #45443f;
  --accent: #7fb0f0;
  --m-metall: #3987e5; --m-holz: #d95926; --m-organik: #199e70; --m-mineral: #c98500; --m-kunst: #d55181; --m-energie: #9085e9; --m-rest: #9a988f;
  --ok: #4cc48a; --on-ok: #08140e; --warn: #e3a338; --bad: #ef7a64; --info: #7fb0f0;
  --c-mp: #d1a052; --c-h: #5bb5b5; --c-hl: #c58ab8; --c-r: #9cc160; --c-e: #e08574;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 700px) { .wrap { padding: 28px 28px 56px; } }

/* ---------- Kopf ---------- */
header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 16px; flex-wrap: wrap; }
.titleblock { min-width: 0; flex: 1 1 520px; }
.eyebrow { font: 600 13px/1.2 "IBM Plex Mono", monospace; letter-spacing: .05em; text-transform: uppercase; margin: 0 0 6px; color: var(--ink-2); }
h1 { font-size: clamp(24px, 3vw, 34px); line-height: 1.15; margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 70ch; }
.hdr-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.iconbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
.iconbtn:hover { border-color: var(--ink-2); }
.iconbtn svg { width: 16px; height: 16px; }
.lang { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); padding: 3px; gap: 3px; }
.lang button { border: 0; background: transparent; border-radius: var(--radius-sm); padding: 4px 10px; cursor: pointer; font: 600 14px "IBM Plex Mono", monospace; transition: background var(--t-fast); }
.lang button:hover { background: var(--surface-2); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.uisw button { font: 500 14px "IBM Plex Sans", sans-serif; display: inline-flex; align-items: center; gap: 6px; }
.uisw svg { width: 16px; height: 16px; flex: none; }
@media (max-width: 699px) { .uisw .ul { display: none; } }

/* ---------- Badges ---------- */
.bdg { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1.35 "IBM Plex Sans", sans-serif; border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: 1px 7px; white-space: nowrap; vertical-align: 1px; background: var(--surface); color: var(--ink); }
.bdg.mono { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.bdg .sw { width: 12px; height: 4px; }
.bdg.demo { border-style: dashed; }
.bdg-list { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
/* Material-Badge: immer getönt (Farbe = Material) */
.bdg.mat { background: color-mix(in srgb, var(--mc) 14%, var(--surface)); border-color: color-mix(in srgb, var(--mc) 45%, var(--line)); }
/* Status-Badges: neutral, farbig in Variante „Status“ */
.c-status .bdg.neu { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); color: color-mix(in srgb, var(--ok) 70%, var(--ink)); }
.c-status .bdg.rest { background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); color: color-mix(in srgb, var(--warn) 65%, var(--ink)); }
.c-status .bdg.weg, .c-status .bdg.mva { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: color-mix(in srgb, var(--bad) 70%, var(--ink)); }
.c-status .bdg.lic-oss { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.c-status .bdg.lic-free { background: color-mix(in srgb, var(--info) 13%, var(--surface)); border-color: color-mix(in srgb, var(--info) 50%, var(--line)); }
.c-status .bdg.lic-com { background: color-mix(in srgb, var(--warn) 13%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.c-status .bdg.lic-own { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.bdg.weg { text-decoration: line-through; }
.ico { width: 12px; height: 12px; flex: none; }

/* ---------- Kennzahlen ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: background var(--t-base), border-color var(--t-base); }
.kpi .lab { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.kpi .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone, var(--ink-2)); flex: none; display: none; }
.kpi .val { font: 600 26px/1.2 "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.kpi .unit { font: 500 14px "IBM Plex Sans", sans-serif; margin-left: 4px; }
.kpi .delta { font-size: 14px; color: var(--ink-2); min-height: 1.5em; }
.kpi .delta.up { color: color-mix(in srgb, var(--ok) 75%, var(--ink)); }
.kpi .delta.down { color: color-mix(in srgb, var(--bad) 75%, var(--ink)); }
.c-kpi .kpi { background: color-mix(in srgb, var(--tone) 10%, var(--surface)); border-color: color-mix(in srgb, var(--tone) 40%, var(--line)); }
.c-kpi .kpi .dot { display: block; }

/* ---------- Steuerung (gemeinsame Bausteine) ---------- */
.app { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.grp { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.gl { font: 600 13px/1.2 "IBM Plex Mono", monospace; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gl .reset { font: 500 14px "IBM Plex Sans", sans-serif; letter-spacing: 0; text-transform: none; border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 0 2px; text-decoration: underline; text-underline-offset: 3px; }
.gl .reset[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius); padding: 5px 10px; font-size: 14px; cursor: pointer; text-align: left; transition: border-color var(--t-fast), opacity var(--t-base), background var(--t-fast); }
.chip:hover { border-color: var(--ink-2); }
.chip.m[aria-pressed="true"] { background: color-mix(in srgb, var(--mc) 12%, var(--surface)); border-color: color-mix(in srgb, var(--mc) 50%, var(--line-2)); }
.chip[aria-pressed="false"] { opacity: .5; }
.chip[aria-pressed="false"] .name { text-decoration: line-through; }
.chip .cnt { font: 500 13px "IBM Plex Mono", monospace; color: var(--ink-2); font-variant-numeric: tabular-nums; display: none; }
.sw { display: inline-block; width: 16px; height: 5px; border-radius: 3px; flex: none; }
.glyph { width: 14px; height: 14px; flex: none; }
.glyph path { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.c-branch .glyph path { fill: color-mix(in srgb, var(--bc) 35%, var(--surface)); stroke: var(--bc); }
.c-branch .chip.c[aria-pressed="true"] { background: color-mix(in srgb, var(--bc) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bc) 50%, var(--line-2)); }

.scn { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); padding: 3px; background: var(--surface); gap: 3px; }
.scn button { position: relative; border: 0; background: transparent; border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; transition: background var(--t-base) var(--ease-out), color var(--t-base) var(--ease-out); }
.scn button:hover { background: var(--surface-2); }
.scn .sc-t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.scn .sc-t i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; flex: none; }
.scn button[data-mode="pot"] .sc-t i { border-style: dashed; }
.scn .sc-v { font-size: 14px; display: none; }
.scn button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.scn button[data-mode="pot"][aria-pressed="true"] { background: var(--ok); color: var(--on-ok); }
.scn button.breathe::after { content: ""; position: absolute; inset: -3px; border-radius: var(--radius); pointer-events: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 50%, transparent); opacity: 0; animation: breathe var(--t-pulse) var(--ease-io) 6 alternate; }
@keyframes breathe { to { opacity: .9; } }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1px solid transparent; background: transparent; border-radius: var(--radius); padding: 7px 14px; cursor: pointer; display: grid; grid-template-columns: auto auto; column-gap: 8px; align-items: center; text-align: left; transition: background var(--t-fast), border-color var(--t-fast); }
.tabs button svg { width: 18px; height: 18px; grid-row: span 2; }
.tabs .tb-t { font-weight: 500; }
.tabs .tb-d { display: none; font-size: 14px; color: var(--ink-2); grid-column: 2; }
.tabs button:hover { background: var(--surface-2); }
.tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line-2); }
.tabs button[aria-selected="true"] .tb-t { font-weight: 600; }
.fdrop > summary { display: none; }
.fbody { display: flex; flex-direction: column; gap: 12px; }
.activef { display: none; }

/* ---------- Variante A: Szenario-Bühne ---------- */
.ui-A .side { gap: 14px; }
.ui-A .grp-scn .gl { display: none; }
.ui-A .scn { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); padding: 0; border: 0; background: transparent; gap: 12px; }
.ui-A .scn button { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius-lg); padding: 14px 18px; gap: 4px; }
.ui-A .scn .sc-t { font-size: 19px; }
.ui-A .scn .sc-v { display: block; font-size: 15px; color: var(--ink-2); }
.ui-A .scn button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ui-A .scn button[data-mode="pot"][aria-pressed="true"] { background: var(--ok); color: var(--on-ok); border-color: var(--ok); }
.ui-A .scn button[aria-pressed="true"] .sc-v { color: inherit; }
.ui-A .scn button[data-mode="pot"]:not([aria-pressed="true"]) { border-color: color-mix(in srgb, var(--ok) 55%, var(--line-2)); }
.ui-A .scn button[data-mode="pot"]:not([aria-pressed="true"]) .sc-t { color: color-mix(in srgb, var(--ok) 80%, var(--ink)); }
.ui-A .fbody { flex-direction: row; flex-wrap: wrap; gap: 12px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; }
.ui-A .grp-mat { flex: 1 1 520px; } .ui-A .grp-cat { flex: 1 1 360px; }
.ui-A .tabs { gap: 0; border-bottom: 1px solid var(--line-2); }
.ui-A .tabs button { border: 1px solid transparent; border-radius: var(--radius) var(--radius) 0 0; padding: 10px 16px; margin-bottom: -1px; }
.ui-A .tabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line-2) var(--line-2) var(--surface); }

/* ---------- Variante B: Seitenleiste ---------- */
@media (min-width: 1000px) {
  .ui-B .app { grid-template-columns: 290px minmax(0, 1fr); }
  .ui-B .side { position: sticky; top: var(--stick); max-height: calc(100vh - 32px); overflow: auto; }
}
.ui-B .side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; gap: 18px; }
.ui-B .tabs { flex-direction: column; gap: 4px; }
.ui-B .tabs button { width: 100%; padding: 8px 10px; }
.ui-B .tabs .tb-d { display: block; }
.ui-B .tabs button[aria-selected="true"] { background: var(--surface-2); border-color: var(--line-2); }
.ui-B .scn { display: flex; flex-direction: column; width: 100%; }
.ui-B .scn .sc-v { display: block; opacity: .9; }
.ui-B .chips { flex-direction: column; align-items: stretch; gap: 4px; }
.ui-B .chip { justify-content: flex-start; width: 100%; }
.ui-B .chip .name { flex: 1; }
.ui-B .chip .cnt { display: inline; }
.ui-B .grp-view { order: -1; }
@media (min-width: 1000px) { .ui-B .layout { grid-template-columns: minmax(0, 1fr); } .ui-B .panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } .ui-B .panel > .back, .ui-B .panel > .stack:first-of-type { grid-column: 1 / -1; } }
@media (min-width: 1400px) { .ui-B .layout { grid-template-columns: minmax(0, 1fr) 340px; } .ui-B .panel { display: flex; } }

/* ---------- Variante C: Kommandoleiste ---------- */
.ui-C { --stick: 84px; }
.ui-C .side { position: sticky; top: 0; z-index: 5; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px; margin: 0 -12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.ui-C .grp { flex-direction: row; align-items: center; }
.ui-C .grp-scn .gl, .ui-C .grp-view .gl { display: none; }
.ui-C .tabs { border: 1px solid var(--line-2); border-radius: var(--radius); padding: 3px; gap: 3px; background: var(--surface); }
.ui-C .tabs button { padding: 5px 12px; }
.ui-C .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ui-C .fdrop { position: relative; }
.ui-C .fdrop > summary { display: inline-flex; list-style: none; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; font-weight: 600; }
.ui-C .fdrop > summary::-webkit-details-marker { display: none; }
.ui-C .fdrop > summary svg { width: 16px; height: 16px; }
.ui-C .fdrop[open] > summary { border-color: var(--ink-2); }
.ui-C .fbody { position: absolute; top: calc(100% + 8px); left: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-lg); padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.ui-C .grp-filter { flex-direction: row; }
.ui-C .fbody .grp { flex-direction: column; align-items: stretch; }
.ui-C .activef { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ui-C .activef button { cursor: pointer; }
@media (max-width: 699px) { .ui-C .side { position: static; } }

/* ---------- Karte + Seitenleiste ---------- */
.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1120px) { .layout { grid-template-columns: minmax(0, 1fr) 360px; } .mapcard { position: sticky; top: var(--stick); } }
.mapcard { background: var(--map-bg); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.maphead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.maphead strong { font-weight: 600; }
.mapscroll { overflow-x: auto; position: relative; }
#map { display: block; width: 100%; min-width: 680px; height: auto; }
.swipe { display: none; font-size: 14px; color: var(--ink-2); padding: 6px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
@media (max-width: 720px) { .swipe { display: block; } }
.legendline { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); background: var(--surface); }
.legendline span { display: inline-flex; align-items: center; gap: 8px; }
.tempo { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.tempo button { border: 1px solid var(--line-2); background: transparent; border-radius: var(--radius-sm); padding: 2px 8px; cursor: pointer; font: 500 14px "IBM Plex Mono", monospace; display: inline-flex; align-items: center; gap: 4px; transition: background var(--t-fast); }
.tempo button svg { width: 12px; height: 12px; }
.tempo button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel.enter > * { animation: rise var(--t-slow) var(--ease-out) both; }
.panel.enter > *:nth-child(2) { animation-delay: 50ms; } .panel.enter > *:nth-child(3) { animation-delay: 100ms; }
.panel.enter > *:nth-child(4) { animation-delay: 150ms; } .panel.enter > *:nth-child(n+5) { animation-delay: 200ms; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.panel h2 { font-size: 20px; line-height: 1.25; margin: 0; font-weight: 600; }
.panel h3 { font-size: 15px; margin: 0 0 8px; font-weight: 600; letter-spacing: .01em; }
.panel p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.back { align-self: flex-start; border: 1px solid var(--line-2); background: transparent; border-radius: var(--radius); padding: 4px 10px; cursor: pointer; font-size: 14px; transition: border-color var(--t-fast); }
.back:hover { border-color: var(--ink-2); }
.catline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }

.stack { display: flex; flex-direction: column; gap: 10px; }
.vb { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 14px; }
.vb .bar { display: flex; height: 14px; gap: 2px; }

function shapeD(cat, r) {
  const k = r;
  switch (cat) {
    case 'mp': return `M0,${-k * 1.18}L${k * 1.18},0L0,${k * 1.18}L${-k * 1.18},0Z`;

}
function moveTip(e) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.classList.remove('on'); }

/* ---------- Filter & Szenario ---------- */
const matChips = $('#matChips'), catChips = $('#catChips');
const matTotal = k => FLOWS.filter(f => f.mat === k).reduce((s, f) => s + val(f), 0);
function buildChips() {
  matChips.innerHTML = Object.entries(MAT).map(([k, m]) => `<button type="button" class="chip m" data-mat="${k}" style="--mc:var(--m-${k})" aria-pressed="${state.mats.has(k)}">${sw(k)}<span class="name">${esc(L(m.name))}</span><span class="cnt">${fmt(matTotal(k))} ${k === 'energie' ? 'MWh' : 't'}</span></button>`).join('');
  catChips.innerHTML = Object.entries(CAT).map(([k, c]) => `<button type="button" class="chip c" data-cat="${k}" style="--bc:var(--c-${k})" aria-pressed="${state.cats.has(k)}">${glyph(k)}<span class="name">${esc(L(c.name))}</span><span class="cnt">${NODES.filter(n => n.cat === k).length}</span></button>`).join('');
  filterState();
}
function filterState() {
  const nm = Object.keys(MAT).length, nc = Object.keys(CAT).length;
  $('[data-reset="mats"]').hidden = state.mats.size === nm;
  $('[data-reset="cats"]').hidden = state.cats.size === nc;
  $('#fcount').textContent = `${state.mats.size + state.cats.size}/${nm + nc}`;
  const off = [...Object.keys(MAT).filter(k => !state.mats.has(k)).map(k => `<button type="button" class="bdg weg" data-mat="${k}">${esc(L(MAT[k].name))} ✕</button>`),
    ...Object.keys(CAT).filter(k => !state.cats.has(k)).map(k => `<button type="button" class="bdg weg" data-cat="${k}">${esc(L(CAT[k].name))} ✕</button>`)];
  $('#activef').innerHTML = off.join('');
}
function toggleFilter(set, k) { set.has(k) ? set.delete(k) : set.add(k); buildChips(); render(); skUpdate(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mat],[data-cat]');
  if (b && b.closest('.side')) toggleFilter(b.dataset.mat ? state.mats : state.cats, b.dataset.mat || b.dataset.cat);
  const r = e.target.closest('[data-reset]');
  if (r) { const s = state[r.dataset.reset]; Object.keys(r.dataset.reset === 'mats' ? MAT : CAT).forEach(k => s.add(k)); buildChips(); render(); skUpdate(); }
  const fd = $('#fdrop'); // Klappfilter (Kommandoleiste) schließt bei Klick daneben
  if (fd.open && root.classList.contains('ui-C') && !e.target.closest('#fdrop')) fd.open = false;
});
const segBtns = $$('.scn button');
function setMode(m) {
  if (state.mode === m) return;
  state.mode = m;
  segBtns.forEach(b => { b.setAttribute('aria-pressed', b.dataset.mode === m); b.classList.remove('breathe'); });
  updateKpis(); panelRender(false); buildTable(); buildChips(); skUpdate();
}
segBtns.forEach(b => b.addEventListener('click', () => { if (b.dataset.mode === 'ist') state.selMeasure = null; setMode(b.dataset.mode); render(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.sel) select(null); $('#fdrop').open = root.classList.contains('ui-C') ? false : $('#fdrop').open; } });

/* ---------- Tabelle ---------- */
function buildTable() {
  const order = Object.keys(MAT), H = L(I.fHead);
  const rows = [...FLOWS].sort((a, b) => order.indexOf(a.mat) - order.indexOf(b.mat) || Math.max(b.ist, b.pot) - Math.max(a.ist, a.pot));
  $('#ftable').innerHTML = `<thead><tr><th>${H[0]}</th><th>${H[1]}</th><th>${H[2]}</th><th>${H[3]}</th><th class="num">${H[4]}</th><th class="num">${H[5]}</th><th class="num">${H[6]}</th></tr></thead><tbody>${rows.map(f => {
    const d = f.pot - f.ist;
    return `<tr data-f="${f.id}"><td>${esc(L(N[f.from].name))}</td><td>${esc(L(N[f.to].name))}</td><td>${esc(L(f.label))}<br>${flowBadges(f, false)}</td><td>${bMat(f.mat)}</td>
      <td class="num">${f.ist ? fmt(f.ist) : '–'}</td><td class="num">${f.pot ? fmt(f.pot) : '–'}</td><td class="num">${d ? (d > 0 ? '+' : '−') + fmt(Math.abs(d)) : '±0'} ${unit(f)}</td></tr>`; }).join('')}</tbody>`;
  $('#ftable').querySelectorAll('tbody tr').forEach(r => {
    r.addEventListener('mouseenter', () => { state.hoverFlow = r.dataset.f; render(); });
    r.addEventListener('mouseleave', () => { state.hoverFlow = null; render(); });
  });
}

/* ---------- Stoffstrombilanz (Sankey) ---------- */
const SK = { s: { ext: ['Von außen', 'From outside'], int: ['Aus dem Park', 'From the park'] },
  d: { park: ['Weitergabe im Park', 'Passed on in the park'], kunden: ['An Abnehmer', 'To customers'], extern: ['Extern verwertet', 'Recovered externally'], mva: ['Verbrennung', 'Incineration'] } };
const skLabel = id => { const [ty, k] = id.split(':'); return L(ty === 's' ? SK.s[k] : ty === 'm' ? MAT[k].name : SK.d[k]); };
const skLinks = (() => {
  const Lk = {};
  FLOWS.forEach(f => {
    if (isEnergy(f)) return;
    const s = N[f.from].cat === 'port' ? 'ext' : 'int';
    const d = f.to === 'mva' ? 'mva' : f.to === 'export' ? 'extern' : (f.to === 'kunden' || f.to === 'agrar') ? 'kunden' : 'park';
    [[`s:${s}`, `m:${f.mat}`], [`m:${f.mat}`, `d:${d}`]].forEach(([a, b]) => {
      const k = a + '|' + b; Lk[k] = Lk[k] || { a, b, mat: f.mat, ist: 0, pot: 0, cur: 0 }; Lk[k].ist += f.ist; Lk[k].pot += f.pot; });
  });
  return Object.values(Lk);
})();
const SKC = [['s:ext', 's:int'], Object.keys(MAT).filter(m => m !== 'energie').map(m => 'm:' + m), Object.keys(SK.d).map(d => 'd:' + d)];
const SKX = [230, 470, 730], NW = 14, TOP = 50, SKH = 430, PAD = 38;
const sk = $('#sankey'), skL = S('g', {}, sk), skN = S('g', {}, sk), skNodes = {};
const skCols = [0, 1, 2].map(i => S('text', { class: 'sk-col', x: i === 0 ? SKX[0] + NW : SKX[i], y: 24, 'text-anchor': i === 0 ? 'end' : 'start' }, sk));
skLinks.forEach(l => {
  l.el = S('path', { class: 'sk-link' }, skL); l.el.style.fill = `var(--m-${l.mat})`; l.el.style.opacity = .42;
  l.el.addEventListener('mouseenter', e => { l.el.style.opacity = .8;
    tip.innerHTML = `<b>${esc(skLabel(l.a))} → ${esc(skLabel(l.b))}</b><div class="tm">${sw(l.mat)}${esc(L(MAT[l.mat].name))}</div>${t('tipIst')} ${fmt(l.ist)} t/a · ${t('tipPot')} ${fmt(l.pot)} t/a`; tip.classList.add('on'); moveTip(e); });
  l.el.addEventListener('mousemove', e => moveTip(e));
  l.el.addEventListener('mouseleave', () => { l.el.style.opacity = .42; hideTip(); });
});
SKC.forEach((c, ci) => c.forEach(id => {
  const g = S('g', {}, skN), r = S('rect', { class: 'sk-node', x: SKX[ci], width: NW, rx: 2 }, g);
  if (id.startsWith('m:')) r.style.fill = `var(--m-${id.slice(2)})`;
  const bg = S('rect', { class: 'sk-bg', rx: 4 }, g); // Hintergrund hinter der Beschriftung, damit sie nicht auf den Bändern liegt
  const lx = ci === 0 ? SKX[0] - 10 : SKX[ci] + NW + 10;
  const tx = S('text', { class: 'sk-lbl', x: lx, 'text-anchor': ci === 0 ? 'end' : 'start' }, g);
  const tn = S('tspan', { x: lx, dy: '-.2em' }, tx);
  const tv = S('tspan', { class: 'sk-val', x: lx, dy: '1.25em' }, tx);
  skNodes[id] = { g, r, bg, t: tx, tn, tv, ci };
}));
function skTexts() {
  L(I.skCols).forEach((c, i) => { skCols[i].textContent = c; });
  Object.entries(skNodes).forEach(([id, n]) => { n.tn.textContent = skLabel(id); });
  sk.setAttribute('aria-label', t('skImg'));
}
function skDraw() {
  const out = {}, inn = {};
  skLinks.forEach(l => { out[l.a] = (out[l.a] || 0) + l.cur; inn[l.b] = (inn[l.b] || 0) + l.cur; });
  const nv = id => Math.max(out[id] || 0, inn[id] || 0);
  const total = Math.max(1, ...SKC.map(c => c.reduce((s, id) => s + nv(id), 0)));
  const k = (SKH - PAD * (Math.max(...SKC.map(c => c.length)) - 1)) / total;
  const pos = {}, flat = SKC.flat();
  SKC.forEach((c, ci) => {
    const colH = c.reduce((s, id) => s + nv(id) * k, 0) + PAD * (c.length - 1);
    let y = TOP + (SKH - colH) / 2;
    c.forEach(id => { const h = nv(id) * k; pos[id] = { x: SKX[ci], y, h, so: 0, si: 0 }; y += h + PAD; });
  });
  [...skLinks].sort((p, q) => flat.indexOf(p.b) - flat.indexOf(q.b)).forEach(l => { const s = pos[l.a]; l.h = l.cur * k; l.y0 = s.y + s.so; s.so += l.h; });
  [...skLinks].sort((p, q) => flat.indexOf(p.a) - flat.indexOf(q.a)).forEach(l => { const tt = pos[l.b]; l.y1 = tt.y + tt.si; tt.si += l.h; });
  skLinks.forEach(l => {
    const x0 = pos[l.a].x + NW, x1 = pos[l.b].x, xm = (x0 + x1) / 2, { y0, y1, h } = l;
    l.el.setAttribute('d', h < .05 ? 'M0,0' : `M${x0},${y0}C${xm},${y0} ${xm},${y1} ${x1},${y1}L${x1},${y1 + h}C${xm},${y1 + h} ${xm},${y0 + h} ${x0},${y0 + h}Z`);
  });
  const visible = !$('#tab-sankey').hidden;
  Object.entries(pos).forEach(([id, p]) => {
    const n = skNodes[id];
    n.r.setAttribute('y', p.y); n.r.setAttribute('height', Math.max(p.h, .5));
    n.t.setAttribute('y', p.y + p.h / 2); n.tv.textContent = `${fmt(nv(id))} t/a`;
    n.g.style.opacity = nv(id) > 0 ? 1 : .35;
    if (visible && n.ci === 1) { const b = n.t.getBBox(); n.bg.setAttribute('x', b.x - 6); n.bg.setAttribute('y', b.y - 2); n.bg.setAttribute('width', b.width + 12); n.bg.setAttribute('height', b.height + 4); }
    else n.bg.setAttribute('width', 0);
  });
}
let skAnim = 0;
function skUpdate(animate = true) {
  const from = skLinks.map(l => l.cur), to = skLinks.map(l => state.mats.has(l.mat) ? l[state.mode] : 0);
  cancelAnimationFrame(skAnim);
  if (RM || !animate || $('#tab-sankey').hidden) { skLinks.forEach((l, i) => { l.cur = to[i]; }); skDraw(); return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - p, 3);
    skLinks.forEach((l, i) => { l.cur = from[i] + (to[i] - from[i]) * e; }); skDraw(); if (p < 1) skAnim = requestAnimationFrame(step); };
  skAnim = requestAnimationFrame(step);
}
ro.observe(sk);

/* ---------- Personas & Tool-Vergleich ---------- */
function buildPersonas() {
  $('#pgrid').innerHTML = Object.keys(PERSONA).map(k => personaHtml(k,
    `<p class="firms catline">${glyph(k)}<span>${NODES.filter(n => n.cat === k).map(n => esc(L(n.name))).join(' · ')}</span></p>`)).join('') +
    `<div class="persona legendcard"><div class="pl">${t('pLegend')}</div><p class="small muted">${t('pLegendT')}</p><div class="cats">${Object.entries(CAT).map(([k, c]) => `<div>${glyph(k)}${esc(L(c.plural))}</div>`).join('')}</div></div>`;
}
// Name, Anbieter, Lizenz-Typ, Stärke, Grenze
const LIC = { free: ['kostenlos', 'free'], com: ['kommerziell', 'commercial'], oss: ['Open Source', 'open source'], own: ['frei (HTML)', 'free (HTML)'] };
const TOOLS = [
  ['STAN', 'TU Wien', 'free', ['Materialflussanalyse nach ÖNORM S 2096, Datenausgleich, Unsicherheiten', 'Material flow analysis per ÖNORM S 2096, data reconciliation, uncertainties'], ['keine Karte, Einzelplatz, für Firmen wenig anschaulich', 'no map, single-user, not very intuitive for companies']],
  ['Umberto', ['iPoint (früher ifu Hamburg)', 'iPoint (formerly ifu Hamburg)'], 'com', ['Stoffstromnetze, Ökobilanz und Kosten in einem Modell', 'Material flow networks, LCA and costs in one model'], ['Lizenzkosten, lange Einarbeitung', 'licence costs, long learning curve']],
  ['e!Sankey', ['iPoint (früher ifu Hamburg)', 'iPoint (formerly ifu Hamburg)'], 'com', ['Sankey-Diagramme mit Excel-Anbindung', 'Sankey diagrams linked to Excel'], ['nur Darstellung, keine Bilanzlogik, keine Geodaten', 'display only, no balance logic, no geodata']],
  ['openLCA', 'GreenDelta', 'oss', ['Ökobilanzen (LCA) mit großen Datenbanken', 'Life cycle assessment (LCA) with large databases'], ['produktbezogen, nicht standortbezogen', 'product-based, not site-based']],
  ['QGIS', ['QGIS-Projekt', 'QGIS project'], 'oss', ['Kartierung auf echten Geodaten, Flurstücke, Flusslinien', 'Mapping on real geodata, parcels, flow lines'], ['keine Stoffstromlogik, Flüsse nur über Plugins', 'no material flow logic, flows only via plugins']],
  ['SankeyMATIC', ['Webtool', 'web tool'], 'free', ['schnelle Sankey-Diagramme im Browser', 'quick Sankey diagrams in the browser'], ['nur Darstellung, keine Karte, keine Szenarien', 'display only, no map, no scenarios']],
  ['SYNERGie', 'International Synergies', 'com', ['Abgleich von Ressourcen zwischen Firmen (industrielle Symbiose)', 'Matching resources between companies (industrial symbiosis)'], ['Lizenz, Datenerfassung bei den Firmen nötig', 'licence, data collection at the companies required']],
  [['Dieser Prototyp', 'This prototype'], ['Projekt A', 'Project A'], 'own', ['Karte, Flüsse, Szenario, Personas in einer Ansicht', 'Map, flows, scenario, personas in one view'], ['Demo-Daten, keine Unsicherheitsrechnung', 'demo data, no uncertainty analysis']],
];
function buildTools() {
  const H = L(I.tHead);
  $('#ttable').innerHTML = `<thead><tr>${H.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${TOOLS.map(([nm, by, lic, plus, minus]) =>
    `<tr><td><b>${esc(L(nm))}</b></td><td>${esc(L(by))}</td><td>${bdg('lic-' + lic, L(LIC[lic]))}</td><td>${esc(L(plus))}</td><td>${esc(L(minus))}</td></tr>`).join('')}</tbody>`;
  $('#gapList').innerHTML = L(I.gap).map(g => `<li>${esc(g)}</li>`).join('');
}

/* ---------- Reiter & Tempo ---------- */
const tabBtns = $$('.tabs button');
function showTab(name) {
  tabBtns.forEach(x => x.setAttribute('aria-selected', x.dataset.tab === name));
  $$('.tabpanel').forEach(p => {
    const on = p.id === 'tab-' + name; p.hidden = !on;
    if (on && !RM) { p.classList.remove('enter'); void p.offsetWidth; p.classList.add('enter'); }
  });
  if (name === 'sankey') skDraw();
  if (name === 'karte') fitPorts();
  hideTip();
}
tabBtns.forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
$$('.tempo [data-sp]').forEach(b => b.addEventListener('click', () => {
  tempo = +b.dataset.sp; $$('.tempo [data-sp]').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (paused) { paused = false; $('#pauseBtn').setAttribute('aria-pressed', 'false'); motion(); } }));
$('#pauseBtn').addEventListener('click', e => { paused = !paused; e.currentTarget.setAttribute('aria-pressed', paused); if (paused) placeStatic(); motion(); });

/* ---------- Sprache anwenden ---------- */
function applyLang(first = false) {
  root.lang = LANG;
  document.title = LANG === 'en' ? 'Material flows Kehrum' : 'Materialfluss Kehrum';
  $$('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  $$('[data-ta]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.ta)); });
  $$('[data-sp]').forEach(b => { b.textContent = (+b.dataset.sp).toLocaleString(LANG === 'en' ? 'en-GB' : 'de-DE') + '×'; });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  themeLbl(); mapTexts(); skTexts(); buildKpis(); updateKpis(!first); buildChips(); buildTable(); buildPersonas(); buildTools();
  if (!first) { panelRender(false); skDraw(); }
}
$$('.lang button').forEach(b => b.addEventListener('click', () => {
  LANG = b.dataset.lang; try { localStorage.setItem('mfk-lang', LANG); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u);
  applyLang();
}));

/* ---------- Farbschema ---------- */
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function themeLbl() { $('#themeLbl').textContent = isDark() ? t('light') : t('dark'); }
try { const th = Q.get('theme') || localStorage.getItem('mfk-theme'); if (th) root.dataset.theme = th; } catch (e) {}
$('#themeBtn').addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('mfk-theme', root.dataset.theme); } catch (e) {} themeLbl(); });

/* ---------- Layout der Bedienung: Bühne · Seitenleiste · Kompakt (?ui=A|B|C, gemerkt) ---------- */
// Farbe trägt Bedeutung: Kennzahlen (Ton je Kennzahl), Branche (Symbole, Chips, Personas), Status-Badges
root.classList.add('c-kpi', 'c-branch', 'c-status');
function setUI(u) {
  if (!['A', 'B', 'C'].includes(u)) u = 'A';
  root.classList.remove('ui-A', 'ui-B', 'ui-C'); root.classList.add('ui-' + u);
  $('#fdrop').open = u !== 'C';
  $$('[data-ui]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ui === u));
}
let UI0 = Q.get('ui'); try { UI0 = UI0 || localStorage.getItem('mfk-ui'); } catch (e) {}
setUI(UI0);
$$('[data-ui]').forEach(b => b.addEventListener('click', () => {
  setUI(b.dataset.ui); try { localStorage.setItem('mfk-ui', b.dataset.ui); } catch (e) {} hideTip();
}));

/* ---------- Start: Flüsse zeichnen sich ein ---------- */
if (Q.get('mode') === 'pot') { state.mode = 'pot'; segBtns.forEach(b => { b.setAttribute('aria-pressed', b.dataset.mode === 'pot'); b.classList.remove('breathe'); }); }
if (N[Q.get('sel')]) state.sel = Q.get('sel');
applyLang(true);
render(); panelRender(); skUpdate(false);
if (Q.get('tab')) showTab(Q.get('tab'));
if (RM) placeStatic();
else {
  FLOWS.forEach((f, i) => {
    if (!f.active) return;
    f.el.style.strokeDasharray = `${f.len} ${f.len}`; f.el.style.strokeDashoffset = f.len;
    f.parts.style.visibility = 'hidden';
    const delay = 350 + (i % 8) * 70;
    setTimeout(() => { f.el.style.transition = `stroke-dashoffset 1.4s var(--ease-out), stroke-width var(--t-xfade) var(--ease-out), opacity var(--t-slow) var(--ease-out)`; f.el.style.strokeDashoffset = 0; }, delay);
    setTimeout(() => { f.el.style.strokeDasharray = ''; f.el.style.strokeDashoffset = ''; f.el.style.transition = ''; f.parts.style.visibility = ''; }, delay + 1500);
  });
  motion();
}
})();
</script>
